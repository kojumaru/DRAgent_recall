product_name: 高電圧バッテリー（セルモジュール）
purpose: >
  高電圧バッテリーのセルモジュールは、電気自動車の駆動用電力を蓄積・供給する主電源として機能する。
components:
  - リチウムイオンセル
  - セルモジュールケース
  - バッテリーマネジメントシステム（BMS）
  - 冷却システム（液冷）
  - バッテリーパックケース
  - サービスディスコネクトスイッチ
functions:
  - セルモジュールの基本単位。陽極（正極）・負極・電解質・セパレータで構成され、電気化学的に充放電を行う
  - 複数セルを固定・保護する筐体
  - 各セルの電圧・温度・電流を監視し、充放電を制御する
  - セルモジュールの温度を適正範囲に維持するための冷却プレートおよび冷媒回路
  - セルモジュール全体を収容する外装構造体（衝突保護機能を兼ねる）
  - 整備時の高電圧遮断用手動スイッチ
top_event: 熱によるバッテリー異常が発生し、火災に至る
