product_name: ステアリングポストガススプリング
purpose: >
  ステアリングポストガススプリングは、封入ガスの圧力によりステアリングポストを任意の傾斜位置に保持する力を発生させ、オペレーターがステアリングホイールを作業・走行に適した位置に固定してかじ取操作を確実に行えるよう支持する機能を担う。
components:
  - ガスシリンダー
  - ピストン・シール
  - チルトペダル
  - ステアリングポスト
functions:
  - 高圧ガス（窒素）を封入してスプリング保持力を発生させるシリンダーとして機能する
  - シリンダー内のガスを密封しながら摺動するピストンとシール部品として機能する
  - ステアリングポストの傾斜角度を調整・固定する操作ペダルとして機能する
  - ステアリングホイールを支持する可動支柱としてガススプリングの保持対象となる
top_event: かじ取操作が確実にできなくなる
