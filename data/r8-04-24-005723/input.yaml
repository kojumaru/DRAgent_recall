product_name: ステアリングポストガススプリング
manufacturer: 株式会社 小松製作所
purpose: >-
  チルトペダルによりステアリングポストの傾斜角を解放した後、ガススプリングがステアリングポストを任意の位置に保持する。オペレーターが操作しやすい位置にハンドル（ステアリングホイール）を固定し、走行・作業中の振動によってもステアリングポストが意図せず動かないよう支持する。
components:
  - ガスシリンダー
  - ピストン・シール
  - チルトペダル
  - ステアリングポスト
functions:
  - 高圧ガスを封入し保持力を発生させるシリンダー
  - シリンダー内のガスを密封し摺動するピストン
  - ステアリングポストの傾斜角を調整・固定する操作ペダル（対策品に交換）
  - ステアリングホイールを支持する可動支柱
top_event: かじ取操作が確実にできなくなる
