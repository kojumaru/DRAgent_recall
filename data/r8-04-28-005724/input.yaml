product_name: バッテリーエネルギーコントロールモジュール（BECM）
purpose: >
  BECMは、リチウムイオン電池セルの充電電流・電圧・温度・SOCを常時監視し、充電制御・熱管理・セルバランシングを行うことでバッテリーパックの安全性と耐久性を維持する。過充電・過放電・過温度からバッテリーを保護する安全機能を担う。
components:
  - リチウムイオン電池（バッテリーパックアッセンブリ）
  - オンボードチャージャー（OBC）
  - バッテリー温度センサー
  - セル電圧センサー
functions:
  - BECMが管理対象とする高電圧電気エネルギー蓄積部品として機能する
  - 外部電源から高電圧バッテリーへの充電を行う車載充電器として機能する
  - 各電池セルの温度を計測してBECMに入力するセンサーとして機能する
  - 各電池セルの電圧を計測してBECMに入力するセンサーとして機能する
top_event: 車両火災が発生する
