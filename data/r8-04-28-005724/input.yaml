product_name: バッテリーエネルギーコントロールモジュール
manufacturer: ジャガー・ランドローバー・ジャパン
purpose: >-
  BECMはリチウムイオン電池の充電電流・電圧・温度・セル状態を常時監視し、充電制御・熱管理・セルバランシングを行う。充電器からの入力電力を制御して各電池セルへの充電量を最適化し、バッテリーパックの安全性と耐久性を維持する。過充電を防ぐ保護機能も担う。
components:
  - リチウムイオン電池（バッテリーパックアッセンブリ）
  - 充電器（OBC
  - バッテリー温度センサー
  - セル電圧センサー
functions:
  - 高電圧電気エネルギーを蓄積する電池セル群
  - オンボードチャージャー）：外部電源から高電圧バッテリーへの充電を行う
  - 各電池セルの温度を計測してBECMに入力する
  - 各電池セルの電圧をBECMに入力する
top_event: 車両火災が発生する
