product_name: ドライバーアシストシステムコントロールユニット
purpose: >
  車体周囲に配置された複数カメラからの映像信号を受信・処理し、サラウンドビュー（俯瞰合成映像）として車内ディスプレイに出力する。
components:
  - サラウンドビューカメラ（前後左右）
  - ヘッドアップディスプレイ／インフォテインメントシステム
  - 車体内ハーネス
  - 車両中央ゲートウェイ
functions:
  - 各方向の映像をユニットに送信する撮像装置
  - 合成映像の表示装置
  - カメラ信号線・電源線・通信線を接続するワイヤハーネス
  - CAN/Ethernetネットワークを介して他ECUと接続する
top_event: 車両の直左映像（左ハンドル車は直右映像）が確認できず、保安基準に適合しない
