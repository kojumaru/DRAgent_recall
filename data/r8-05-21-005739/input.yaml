product_name: 前席シートベルトテンショナー
purpose: 衝突検知時にプリテンショナー機構がシートベルトを瞬時に引き込み、ロック機構により拘束力を保持して衝突時の乗員前方移動を抑制する乗員拘束装置である。
components:
  - プリテンショナー機構
  - ロック機構
  - ウェビング（ベルト本体）
  - リトラクタ（巻き取り装置）
functions:
  - 衝突時にシートベルトを瞬時に引き込む火薬式アクチュエータとして機能する
  - 引き込み後にシートベルトが弛まないよう拘束力を保持するラチェット式ロックとして機能する
  - 乗員を拘束するポリエステル製繊維帯として機能する
  - プリテンショナーとロック機構を内蔵するシートベルト巻き取りユニットとして機能する
top_event: 衝突時の乗員保護性能が低下する
