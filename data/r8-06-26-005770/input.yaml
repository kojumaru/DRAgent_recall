product_name: シールリング（燃料ポンプ取付部）
purpose: 燃料タンクの燃料ポンプ取付開口部に装着され、燃料ポンプとタンク間の気密・液密を維持して燃料の外部漏洩を防止するゴム製または樹脂製シール部品である。
components:
  - シールリング本体
  - 燃料ポンプ取付フランジ
  - 燃料タンク開口部
  - 固定ナット・ロックリング
functions:
  - 燃料ポンプ取付部に装着するゴム製または樹脂製シール部品として気密を維持する
  - 燃料ポンプをタンクに固定するフランジ部品として機能する
  - 燃料ポンプが挿入されるタンク側開口部として機能する
  - 燃料ポンプをタンクに固定してシールリングを圧縮保持する締結部品として機能する
top_event: 燃料が漏れるおそれがある
