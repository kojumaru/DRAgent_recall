product_name: シートベルトバックル配線（2列目座席）
purpose: 2列目座席シートベルトバックルスイッチと制御ユニット間を電気的に接続し、シートベルトの装着・非装着状態をシートベルト非装着時警報装置へ伝達する電気配線部品である。
components:
  - バックル配線（電線束）
  - シートベルトバックル（スイッチ付き）
  - SBW制御ユニット
  - コネクタ・端子
functions:
  - バックルスイッチと制御ユニット間を接続する被覆電線として機能する
  - シートベルト装着状態を検知するスイッチを内蔵したバックル本体として機能する
  - バックルスイッチの信号を受信して警報を制御するユニットとして機能する
  - バックルスイッチ側および制御ユニット側との電気接続部品として機能する
top_event: シートベルト装着状態が正しく警報されなくなる
