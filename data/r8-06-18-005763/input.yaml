product_name: 前輪ブレーキケーブル
purpose: ブレーキレバーの操作力をマスタシリンダへ伝達し、ブレーキレバー非操作時は制動液圧がかからずブレーキ引きずりが生じないよう適正に調整された制動力伝達部品である。
components:
  - 前輪ブレーキケーブル（ワイヤーまたは油圧ホース）
  - マスタシリンダ
  - フロントブレーキキャリパー（またはドラムブレーキ）
  - ケーブルアジャスター（調整機構）
functions:
  - ブレーキレバー操作力を前輪ブレーキへ伝達する部品として機能する
  - ブレーキレバー入力を油圧に変換するシリンダー部品として機能する
  - ホイールに制動力を付与するブレーキ実行部品として機能する
  - ブレーキケーブルの遊び量を調整する部品として機能する
top_event: 前輪がロックして転倒するおそれがある
