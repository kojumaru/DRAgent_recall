product_name: エンジン制御コンピュータ（エンジン制御プログラム）
purpose: E13Cディーゼルエンジンの燃料噴射量・DPR再生・尿素SCR触媒の還元剤噴射量を最適制御し、エンジン出力性能の発揮と排出ガス規制値への適合を達成する
components:
  - DPR（ディーゼル微粒子除去装置）
  - 尿素SCR触媒（第2マフラー内蔵）
  - DPR再生制御プログラム
  - SCR触媒劣化判定プログラム
  - NOxセンサ（上流・下流）
  - 排気温度センサ
  - 尿素水インジェクタ
functions:
  - 排ガス中のPMを捕集するフィルタで定期的に高温燃焼再生が必要
  - 排ガス中のNOxを尿素水と化学反応させて無害なN₂に変換する触媒装置
  - 走行条件に応じてDPR再生タイミング・温度プロファイルを制御するソフトウェアモジュール
  - SCR触媒の浄化効率をNOxセンサ出力から計算し劣化判定を行うソフトウェアモジュール
  - SCR触媒前後のNOx濃度を測定しECUへフィードバックする
  - DPR・SCR入口温度を計測しECUへ入力する
  - ECUの指令で尿素水をSCR触媒上流の排気管に噴射する
top_event: NOx排出値が規制値を超える
