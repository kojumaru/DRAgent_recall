product_name: キャビンガラス
purpose: オペレータの視界を確保しながら風雨・粉塵からキャビン内部を保護し、接着固定により気密性・水密性を維持する。
functions:
  - ガラスを保持する鋼製フレーム構造体として機能する
  - 開閉式ドアのフレームとドアガラスを組み合わせて保持する
  - ガラスとフレーム間を接着固定し、気密性・水密性を確保する
  - 接着剤とガラス面・フレーム面の密着性を高める
  - 接着部周囲を覆い接着部の紫外線劣化を防止する
components:
  - キャビンフレーム（キャビンCMP）
  - ドアCMP（右/左）
  - ウレタン系接着剤
  - プライマー（下塗り剤）
  - ガラスモール（シール）
top_event: ガラスが脱落する
