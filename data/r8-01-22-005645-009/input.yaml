product_name: ステアリングホイール-ステアリングコラム締結ナット
purpose: ステアリングホイールとステアリングコラムシャフトをテーパー嵌合部において軸方向に締結し、運転者の操舵力をステアリングシャフトへガタつきなく確実に伝達する
functions:
  - テーパー嵌合部を規定締付トルクで軸方向に固定し適切なクランプ力を維持する
  - 操舵トルクをコラムシャフトへ滑りなく伝達する
  - 走行中の振動・衝撃荷重に対して規定の締付状態を維持する
components:
  - ステアリングホイール
  - ステアリングコラムシャフト（上端部）
  - テーパースプライン嵌合部
  - 締結ナット
  - ワッシャ
top_event: ステアリングホイール操作時にガタつきが発生する
