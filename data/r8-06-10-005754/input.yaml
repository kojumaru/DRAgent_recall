product_name: ヘッドカバー（ブローバイガス排気口）
purpose: シリンダーヘッド上部を密閉してオイルの漏洩を防止するとともに、ブローバイガス排気口を通じてクランクケース内のブローバイガスをエンジン吸気系へ還流する金属製カバーである。
components:
  - ヘッドカバー本体
  - ブローバイガス排気口
  - ヘッドカバーガスケット
  - PCVバルブ（ポジティブクランクケースベンチレーション）
functions:
  - シリンダーヘッド上部を密閉するアルミまたは鋼製カバーとして機能する
  - ヘッドカバー内のブローバイガスをPCVシステムへ排出する開口部として機能する
  - ヘッドカバーとシリンダーヘッド間のオイル漏れを防止するシール材として機能する
  - ブローバイガスを吸気系へ還流する弁として機能する
top_event: 火災に至る
