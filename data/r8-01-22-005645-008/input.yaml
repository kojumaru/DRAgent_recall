product_name: フロント・ショートレンジ・レーダー・センサ（電子基板）
purpose: ミリ波を送受信して車両前方近距離の物体を検出し、距離・相対速度情報を運転支援システムコントロールユニットへ送信することで衝突被害軽減ブレーキ等の運転支援機能を実現する
functions:
  - ミリ波（76〜77 GHz帯）を送受信して前方物体を周期的に検出する
  - 検出した物体の距離・相対速度・角度をCAN通信で上位ECUへ周期送信する
  - 自己診断を実行し内部故障状態をCANメッセージで上位ECUへ通知する
  - 銅メッキ配線層が正常な導通状態を維持しMMIC・DSP・通信回路間の信号伝達を確保する
components:
  - 送受信アンテナ（パッチアンテナ）
  - ミリ波IC（MMIC）
  - 信号処理IC（DSP/マイコン）
  - 電源回路
  - CAN通信インターフェース
  - 銅メッキ配線層
top_event: 衝突被害軽減ブレーキが作動しない
