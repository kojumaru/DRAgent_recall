product_name: 低圧燃料ポンプ（インペラ）
purpose: >
  低圧燃料ポンプは、燃料タンク内の燃料を汲み上げてエンジンの燃料噴射システムへ必要な流量・圧力で連続的に供給する燃料供給系の動力源として機能し、インペラの回転により燃料に圧力を与えることで安定した燃料流量を維持する。
components:
  - インペラ（樹脂製羽根車）
  - ポンプケース
  - ポンプモーター
  - 燃料フィルター
functions:
  - ポンプケース内で回転して燃料を加圧・圧送する樹脂製回転部品として機能する
  - インペラを内包して燃料流路を形成するケーシングとして機能する
  - インペラを回転駆動する電動直流モーターとして機能する
  - 燃料中の異物を除去するフィルターとして機能する
top_event: 走行中エンストに至る
