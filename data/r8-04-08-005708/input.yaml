product_name: 低圧燃料ポンプ（インペラ）
manufacturer: トヨタ自動車株式会社
purpose: >-
  低圧燃料ポンプは燃料タンクから燃料を汲み上げ、燃料フィルターを通してエンジンの燃料噴射システムへ燃料を低圧で圧送する。インペラが回転することで燃料に圧力が与えられ、安定した燃料供給が維持される。エンジン始動から停止まで連続して作動する。
components:
  - インペラ（樹脂製羽根車）
  - ポンプケース
  - ポンプモーター
  - 燃料フィルター
  - デリバリーパイプ
functions:
  - ポンプケース内で回転して燃料を圧送する樹脂製部品
  - インペラを内包し燃料流路を形成するケーシング
  - インペラを回転駆動する電動モーター
  - 燃料中の異物を除去するフィルター
  - 低圧燃料ポンプからエンジンへの燃料供給管
top_event: 走行中エンストに至る
