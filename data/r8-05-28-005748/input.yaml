product_name: ヒーターコア
purpose: エンジン冷却水（温水）を通水してHVACユニット内の空気を加熱し、車室内の暖房およびフロントガラスのデフロスト機能に必要な温風を供給する熱交換器である。
components:
  - ヒーターコア本体（熱交換器コア）
  - 入口・出口パイプ（ニップル）
  - HVACユニット（暖房・空調ユニット）
  - エンジン冷却水系統（ウォーターポンプ・サーモスタット）
functions:
  - 銅またはアルミ製チューブとフィンにより構成される熱交換部品として機能する
  - エンジン冷却水をヒーターコアへ導入・排出する接続パイプとして機能する
  - ヒーターコアを収容し送風・温度制御を行うユニットとして機能する
  - ヒーターコアへ温水を供給する冷却水循環系統を構成する
top_event: 暖房及びデフロスタ機能が低下する
