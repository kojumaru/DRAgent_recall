product_name: トランスミッション配線
purpose: >
  トランスミッション制御コンピュータからの変速制御信号と電力を、AT内部の各アクチュエータ・センサに伝達し、ハイブリッドシステムの動力補助機能を成立させる。
components:
  - トランスミッション制御コンピュータ（TCU）
  - フロントプロペラシャフト
  - コネクタ・グロメット
  - 配線固定クランプ
functions:
  - 配線を介してATの変速動作を制御する
  - 配線経路近傍を回転する駆動軸
  - 配線端末の電気接続部品および車体貫通部の防水シール
  - 配線を所定の配索経路に保持する固定具
top_event: ギア段がニュートラルに固定され走行不能になる
