product_name: ブレーキペダル
purpose: ドライバーの踏力を受けブレーキブースターおよびマスターシリンダへ機械的に伝達する
components:
  - ペダルアーム
  - ピボット軸・ブッシュ
  - 連結ロッド（プッシュロッド）
  - 連結ピン
  - 連結ピン固定クリップ
functions:
  - 踏力を受けるレバー部材
  - ペダルの回動中心となる軸とその軸受
  - ペダルアームとブレーキブースターを接続するロッド
  - ペダルアームとロッドを結合するピン
  - 連結ピンの脱落を防止するクリップ
top_event: ブレーキペダルとロッドの連結が外れてブレーキが効かなくなる
