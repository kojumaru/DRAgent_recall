product_name: サイドスライド窓ストッパー（窓レール）
purpose: 補助席付き車両のサイドスライド窓の最大開放位置を機械的に規制し、窓の開放部有効幅が保安基準規定値（500mm以下）に収まるよう位置決めするストッパー部品である。
components:
  - ストッパー本体
  - 窓レール
  - サイドスライド窓（ガラスパネル）
  - 取付けブラケット・ファスナー
functions:
  - 窓の最大スライド位置を機械的に規制する位置決め部品として機能する
  - サイドスライド窓が摺動するガイドレールとして機能する
  - 乗客窓として機能するスライド式窓ガラスとして機能する
  - ストッパーをレールに固定する締結部品として機能する
top_event: 保安基準に適合しない
