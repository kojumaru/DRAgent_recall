product_name: メータークラスター（車載式故障診断装置表示機能）
purpose: 排出ガス関連システムの異常をECUから受信してドライバーにエンジン警告灯（MIL）の点灯により通知する車両状態の表示装置として機能する
components:
  - メータークラスター制御ユニット
  - エンジン警告灯（MIL）
  - 液晶表示部・計器部
  - CAN通信インターフェース
  - 電源回路
functions:
  - 計器制御・警告灯制御プログラムを実装したマイクロコントローラベースの電子基板
  - OBD異常検知時に点灯するアンバー色の警告灯（ISO 2575準拠の表示シンボル）
  - 速度・回転数等を表示するアナログ計器または液晶ディスプレイ
  - ECU・パワートレイン制御モジュールとのCAN-BUS通信回路
  - バッテリ電圧から内部回路動作電圧を生成する電源IC
top_event: 保安基準に適合しない
