product_name: 後輪車軸
purpose: 走行装置の一部として後輪ホイールをスイングアームに固定・保持するとともに、駆動力を後輪へ伝達し制動時の荷重を受け持つ構造部材として機能する
components:
  - 後輪アクスルシャフト
  - ホイールベアリング（左右各1個）
  - アクスルナット
  - スプロケットハブ（リヤスプロケット）
  - スイングアーム
  - チェーンアジャスター
functions:
  - 鋼製の円筒形シャフト本体（高強度鋼製、表面処理済み）
  - 後輪ハブとスイングアームの間に介在する転がり軸受で、回転荷重を支持する
  - シャフト両端を固定するナット（規定トルクで締め付ける締結部品）
  - チェーン駆動スプロケットを固定するハブ部品
  - 後輪サスペンションのリンク部材でアクスルシャフトを介して後輪を保持
  - アクスルシャフト位置を調整してチェーンテンションを設定する調整機構
top_event: 後輪車軸が破断し転倒する
