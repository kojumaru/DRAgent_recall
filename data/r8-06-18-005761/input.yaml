product_name: 右側EMFアクチュエーター（電気モーター）
purpose: ECUからの制御信号を受けてモーターコイルの通電によりブレーキキャリパーを機械的に押圧・解除し、電気機械式パーキングブレーキの作動・解除を電動制御するアクチュエーターである。
components:
  - 電気モーター（DCモーターまたはブラシレスDCモーター）
  - ギアボックス（減速機構）
  - モーターコイル・ステーター
  - EMF制御ECU
functions:
  - モーターコイル通電によりアクチュエーターシャフトを回転駆動する電動機として機能する
  - モーター回転をブレーキキャリパー押圧力に変換する歯車列として機能する
  - モーターの固定子部品として電磁力を発生させるコイル巻き線として機能する
  - EMFアクチュエーターの作動・解除を電気制御するコントロールユニットとして機能する
top_event: 電気機械式パーキングブレーキの作動あるいは解除ができなくなる
