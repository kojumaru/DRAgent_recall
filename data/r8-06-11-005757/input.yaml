product_name: ホイールボルト
purpose: ホイール（車輪）をハブに締結固定し、走行中の駆動力・制動力・側力・上下力をハブおよびサスペンションへ伝達する高強度締結部品である。
components:
  - ホイールボルト
  - ホイール（リム）
  - ハブ（ホイールハブ）
  - ナット（ホイールナット）
functions:
  - ホイールをハブに締結する高強度ねじ部品として機能する
  - タイヤを装着する車輪のリム部品として機能する
  - ホイールが取り付けられる車軸側ブラケット部品として機能する
  - ホイールボルトと対となる締結ナットとして機能する
top_event: 当該ボルトが外れてホイールが脱落する
