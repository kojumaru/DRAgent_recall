product_name: 着脱式可搬バッテリ（バッテリセル）
purpose: 電動二輪車の駆動用電源として直流電力をモーターコントローラに供給し、走行に必要な電気エネルギーを蓄積・放出する
components:
  - バッテリセル
  - セル外装（金属缶/積層フィルム）
  - 電極層（正極・負極）
  - 電解液
  - BMS（バッテリ管理システム）
  - バッテリ筐体
  - 充電コネクタ／放電コネクタ
functions:
  - リチウムイオン化学反応により直流電力を蓄積・放出する基本単位
  - セル内部の電極・電解液を密封し外部環境から保護する筐体
  - 充放電反応を担う活物質層。外径寸法がセル外装内部の応力状態を決定する
  - リチウムイオンの移動媒体。セル外装が密封されることで所定量が保持される
  - 各セルの電圧・温度・電流を監視し、過充電・過放電・過電流を防止する制御基板
  - 複数セルおよびBMSを収納・固定するプラスチック/金属製外装ケース
  - 外部充電器および車両側コントローラとの電気的接続部
top_event: セルが発火し火災に至る
