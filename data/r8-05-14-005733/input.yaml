product_name: 後席シートのヘッドレスト折り畳み機構（2列目左右）
purpose: 2列目シートバック折り畳み時にヘッドレストを前倒しし、復帰操作時に正規の着座支持位置にヘッドレストを固定する機械式位置固定機構である。
components:
  - ヘッドレスト本体
  - 折り畳み機構（ヒンジ・ロック部）
  - 固定ロック機構
  - ヘッドレストポスト（ステー）
  - シートバック（2列目）
functions:
  - 後頭部を支持するウレタンパッド・表皮材一体の頭部支持部品として機能する
  - ヘッドレストを前倒し・復帰させるヒンジ軸とロック爪・バネ機構として動作する
  - ヘッドレストが正規の角度・位置に固定される爪式または摩擦式ロック機構として機能する
  - シートバックの挿入孔に差し込まれる金属製支柱として機能する
  - ヘッドレストおよびその機構を支持するシート背もたれ部を構成する
top_event: 保安基準に適合しない
