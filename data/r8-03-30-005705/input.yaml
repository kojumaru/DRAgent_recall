product_name: 排気後処理制御装置用コントロールユニット（ACM）
purpose: SCRシステムへの尿素水噴射を精密制御し、各センサ・アクチュエータの動作状態を常時監視して故障検知時にエンジン警告灯（MIL）を点灯させる
components:
  - ACMマイクロコントローラ
  - 尿素水ポンプ（AdBlueポンプ）
  - 尿素水ポンプ回転センサー
  - NOxセンサー（SCR上流・下流）
  - 尿素水噴射ノズル
  - SCR触媒
  - CANインターフェース
functions:
  - SCRシステム制御アルゴリズムおよびOBD診断ロジックを実行するCPUとフラッシュメモリを含む制御基板
  - 尿素水タンクから尿素水を加圧して噴射ノズルへ供給するポンプ
  - 尿素水ポンプの回転数を検出するセンサーで、ポンプの正常動作確認に使用
  - 排出ガス中のNOx濃度を計測するセンサー
  - 排気管内に尿素水を噴霧するアクチュエータ
  - NOxを窒素と水に還元する触媒コンバーター
  - エンジンECU・車体制御系との通信バス
top_event: 保安基準に適合しない
