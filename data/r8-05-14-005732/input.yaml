product_name: 可変容量オイルポンプ（ステータ／ハウジングカバー）
purpose: エンジン回転数・負荷条件に応じてステータ位置を変化させ、エンジン各部へ規定油圧の潤滑油を継続的に供給する可変容量型ポンプである。
components:
  - ステータ（固定子）
  - ハウジングカバー（ステータ摺動面）
  - ロータ
  - オイルコントロールバルブ
  - エンジンオイルストレーナ・オイルパン
functions:
  - 変位によってポンプ容量を制御する可動部材として機能する
  - ステータが摺動する精密加工面を持つポンプカバーとして機能する
  - エンジンクランクシャフトにより駆動される回転部品として動力を伝達する
  - 油圧制御弁としてステータ位置をアクチュエータ油圧で制御する
  - ポンプへの吸入側潤滑油供給経路を構成する
top_event: エンジンが焼き付き走行不能に至る
