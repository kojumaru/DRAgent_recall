product_name: リチウムイオンバッテリコントローラ
purpose: リチウムイオンバッテリの充放電・電圧・温度・SOCを監視・制御し、正常なバッテリ状態において駆動モーターへの電力供給を継続するバッテリ管理システム電子制御ユニットである。
components:
  - バッテリコントローラECU（BMSコントローラ）
  - 電圧・電流・温度センサー群
  - リチウムイオンバッテリモジュール
  - 駆動モーター・インバーター
functions:
  - バッテリ状態を監視・制御する電子制御ユニットとして機能する
  - バッテリセルの状態を計測するセンサー部品として機能する
  - 駆動・回生電力を蓄積するバッテリとして機能する
  - バッテリコントローラから電力供給を受けて走行駆動力を発生させるシステムとして機能する
top_event: 走行中に駆動用モータへの出力を停止し走行不能に至る
