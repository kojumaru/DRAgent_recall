product_name: 速度伝達用ギヤユニット（交換修理用部品）
purpose: アクスルシャフトの回転を所定のギヤ比でスピードメーターケーブルへ機械的に変換・伝達し、速度計が法規要件を満たす速度表示を行えるようにする。
functions:
  - アクスルシャフトから直接駆動されて回転を伝達する
  - ドライブギヤから回転を受け取りスピードメーターケーブルへ伝達する
  - 両ギヤを内包しアクスルシャフトに固定される外殻として機能する
  - ドリブンギヤの回転を速度計本体へ伝達する
  - ギヤユニットハウジングをアクスルシャフトへ固定する
components:
  - ドライブギヤ（駆動側ギヤ）
  - ドリブンギヤ（被動側ギヤ）
  - ギヤユニットハウジング
  - スピードメーターケーブル
  - アクスルシャフト締め付けナット
top_event: 速度計が作動しなくなり保安基準に適合しない
