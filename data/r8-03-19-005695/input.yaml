product_name: ピストン・トップリング
purpose: >
  ピストンは燃焼ガス圧を受けてコンロッドへ力を伝達する動力変換部材として機能し、トップリングはピストンとシリンダ壁間の気密を保持して燃焼ガスの吹き抜けを防止するとともに、エンジンオイルが燃焼室へ過剰に吸い上げられないよう制御する役割を担う。
components:
  - シリンダ（シリンダボア）
  - エンジンオイル（潤滑油膜）
  - コンロッド
  - セカンドリング・オイルコントロールリング
functions:
  - ピストンおよびトップリングが摺動する精密加工された内壁面として機能する
  - ピストンリングとシリンダ壁間の油膜として摩擦・摩耗を低減する媒体として機能する
  - ピストンの往復運動をクランクシャフトの回転運動に変換する連接棒として機能する
  - トップリングと組み合わせて気密・オイル制御機能を補完する部品として機能する
top_event: 火災に至る
