product_name: ピストン
purpose: >
  ピストンは、燃焼室で発生した高圧・高温ガスの圧力を受け止め、往復直線運動をコンロッドを介してクランクシャフトの回転運動に変換する動力変換部材である。
components:
  - トップリング（第1圧力リング）
  - セカンドリング（第2圧力リング）
  - オイルコントロールリング
  - ピストンピン
  - コンロッド
  - シリンダ（シリンダボア）
functions:
  - ピストン頂部に最も近いリング溝に装着される。主として燃焼ガスの気密を担い、ガスの吹き抜けを防止する。リング合口隙間がピストンとの嵌合精度を決定づける
  - トップリングの補助として気密機能を持つとともに、オイル掻き落とし機能も持つ
  - クランクケース側からのオイルをシリンダ壁から掻き落とし、燃焼室へのオイル流入を防止する
  - ピストンとコンロッドを連結するピン
  - ピストンの往復運動をクランクシャフトの回転運動に変換する連接棒
  - ピストンが摺動する精密加工された内壁面
top_event: 火災に至る
