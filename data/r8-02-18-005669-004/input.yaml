product_name: 高電圧バッテリーモジュール
purpose: 高電圧バッテリーシステムの中核構成品として電動モータへの電力供給と回生電力の受け入れを行う
components:
  - リチウムイオンセル
  - セルホルダ（モジュールケース）
  - バスバー
  - セル間絶縁シート
  - 温度センサ
functions:
  - 電気化学反応により充放電を行う最小単位
  - セルを所定の位置に保持し機械的保護を提供する構造体
  - セル間を電気的に接続する導電性金属板
  - 隣接セル間の電気的絶縁を確保するシート
  - モジュール内温度をBMSに伝達する計測素子
top_event: 火災に至る
