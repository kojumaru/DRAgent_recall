product_name: エンジンコントロールユニット（ECU）
purpose: エンジン各部のセンサ信号を入力として燃料噴射量・点火時期を演算制御し、運転状態パラメータを車載式故障診断装置（OBD）経由で外部診断機へ提供する。
functions:
  - エンジン回転数・クランク位相信号をECUへ供給する
  - スロットル開度をECUへ供給する
  - 吸入空気温度をECUへ供給する
  - 大気圧をECUへ供給し負荷計算に使用する
  - ECUからの噴射パルス信号を受けて燃料噴射を実施する
  - ECUからの点火信号を受けて点火を実施する
  - 外部スキャンツールとのOBD通信インタフェースを提供する
components:
  - クランク角センサ
  - スロットルポジションセンサ（TPS）
  - 吸気温センサ
  - 大気圧センサ
  - インジェクタ
  - イグナイタ／点火コイル
  - OBD診断ポート（DLC3）
top_event: 外部診断機にエンジン停止時の負荷計算値が正しく表示されず保安基準に適合しない
