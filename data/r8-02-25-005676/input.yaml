product_name: 後部反射器取付けブラケット（灯火装置）
manufacturer: 株式会社 豊田自動織機
purpose: >-
  後部反射器取付けブラケットは後部反射器を車両後部の所定位置に保持し、他の車両や歩行者に車両の存在を知らせる。道路運送車両の保安基準では後部反射器の取付位置（車両最外側から400mm以内）および灯火の装備が義務付けられている。
components:
  - 後部反射器
  - 尾灯
  - 制動灯
  - 後退灯
  - 車体後部フレーム
functions:
  - 後方からの光を再帰反射して車両の存在を示す反射板
  - 車両後部に設置し後続車両に存在を示す灯火
  - 制動時に後続車両に制動を知らせる灯火
  - 後退時に後方の歩行者・車両に警告する灯火
  - ブラケットを固定する構造体
top_event: 保安基準に適合しない
