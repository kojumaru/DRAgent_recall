product_name: ドライバーアシストシステムコントロールユニット
purpose: 車両前後左右に設置された複数のカメラからの映像信号を受信・処理し、サラウンドビュー合成映像を生成して車内ディスプレイへ出力することで運転者が車両直左を含む全周囲を確認できる視野確保機能を実現する
functions:
  - 各カメラからの映像信号を途切れなく受信しサラウンドビュー合成映像を生成する
  - 保安基準が定める車両直左映像を常時途切れなくディスプレイへ出力する
  - 車速・操舵角に応じたガイドラインを合成映像に重畳する
  - 自己診断結果をCANバスへ定期送信する
components:
  - 各方向カメラ（フロント・リア・左右サイド）
  - 映像信号ケーブル（カメラ～ユニット間）
  - 映像処理IC（SoC/DSP）
  - 映像出力回路
  - CANバスインターフェース
  - 電源回路
top_event: 保安基準に適合しない
