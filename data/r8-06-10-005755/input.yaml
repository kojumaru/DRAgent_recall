product_name: ブレーキスイッチ
purpose: ブレーキペダルの踏み込みを検知してON信号を出力し、制動灯（ブレーキランプ）を点灯させるブレーキペダル連動電気スイッチである。
components:
  - ブレーキスイッチ本体
  - ブラケット（固定金具）
  - ブレーキペダル（アクチュエータ）
  - 制動灯（ブレーキランプ）
functions:
  - ブレーキペダルの動きを検知してON/OFFを切り替える電気スイッチとして機能する
  - ブレーキスイッチを所定位置に固定する金属製ブラケットとして機能する
  - スイッチを作動させるペダル機構として機能する
  - スイッチON信号により点灯する灯火部品として機能する
top_event: 制動灯が点灯しなくなる
