product_name: コンビネーションメータ（基板構成素子）
purpose: >
  車速センサからのパルス信号を受信して車速・走行距離を演算・表示し、エンジン・制動装置・警告システム等の状態をドライバーに視覚的に伝達する。
components:
  - 車速センサ
  - エンジン制御ユニット（ECU）
  - 車体ハーネス
  - インストルメントパネル
functions:
  - 車軸の回転数に応じたパルス信号をコンビネーションメータに送信する
  - エンジン回転数・警告信号をCAN通信で送信する
  - 電源（12V）およびCAN通信線を接続する配線
  - コンビネーションメータを固定・保護するパネル筐体
top_event: 短絡して速度計や走行距離計等が作動しなくなり、保安基準に適合しないおそれがある。
