product_name: シートサスペンション（ラチェットギア締結部）
manufacturer: いすぐ自動車株式会社
purpose: >-
  シートサスペンションは運転者席の座面高さを調整・固定する機能を持つ。エア回路により座面高さを上下に調整し、ラチェットギアにより調整後の高さを固定する。サスペンションロック機能により、走行振動によって座面が意図せず移動しないよう保持する。
components:
  - ラチェットギア
  - ラチェットギア締結部ナット
  - エア回路
  - 電磁遮断弁
  - 電磁遮断弁制御ECU
functions:
  - 座面高さ調整後にロックするギア機構
  - ラチェットギアをシート構造体に固定するナット
  - 空気圧を利用してサスペンション高さを調整する回路
  - エア回路を開閉する電磁弁（対策品として追加）
  - 電磁遮断弁を制御する電子制御ユニット（対策品として追加）
top_event: 走行振動によりシートサスペンションロックが意図せず解除されて座面が上昇する
