product_name: シートサスペンション（運転者席）
purpose: >
  シートサスペンションは、運転者席の座面高さをドライバーの体格・好みに応じて調整・固定し、走行中の路面振動を緩衝してドライバーの疲労低減と良好な視界・操作姿勢を維持する機能を担う。
components:
  - ラチェットギア
  - ラチェットギア締結部ナット
  - エア回路
  - 電磁遮断弁
functions:
  - 座面高さ調整後に位置をロックするギア機構として機能する
  - ラチェットギアをシート構造体に固定する締結部品として機能する
  - 空気圧を利用してサスペンション高さを調整する回路として機能する
  - エア回路を開閉して座面高さ調整を制御する電磁弁として機能する
top_event: サスペンションロックが機能しなくなる
