product_name: コモンレール（燃料パイプ接続部）
purpose: 高圧燃料ポンプから圧送される高圧燃料を蓄圧して各インジェクタへ均一に供給し、燃料パイプ接続部のシール性を維持する高圧燃料蓄圧管である。
components:
  - コモンレール本体（蓄圧管）
  - 燃料パイプ接続部（シール部）
  - 高圧燃料ポンプ
  - 燃料圧力センサー
functions:
  - 高圧燃料を蓄圧する金属製パイプとして機能する
  - 高圧燃料パイプとの接続部シール面として気密を維持する
  - コモンレールへ高圧燃料を圧送するポンプとして機能する
  - コモンレール内の燃料圧力を計測する圧力センサーとして機能する
top_event: 火災に至る
