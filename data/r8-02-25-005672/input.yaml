product_name: スタータ（始動用リレー接点部）
purpose: >
  始動用リレー接点部は、エンジン始動装置の主電力スイッチとして、スタートスイッチまたはアイドリングストップECUからの指令を受けてバッテリからスタータモーターへ大電流を通電し、エンジンクランキングを実現する機能を担う。
components:
  - 始動用リレー（ソレノイドスイッチ）
  - スタータモーター
  - バッテリ
  - スタートスイッチ／アイドリングストップECU
functions:
  - スタータモーターへの大電流を断続する電磁リレー本体として機能する
  - クランクシャフトを回転駆動するDCモーターとして機能する
  - スタータ駆動用の大電流を供給する12 Vバッテリとして機能する
  - ドライバーの始動指令またはアイドリングストップ再始動信号を出力する制御装置として機能する
top_event: 火災に至る
