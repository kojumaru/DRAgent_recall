product_name: チェックバルブ
purpose: 油圧回路において一方向の流体通過を許容し逆方向の流れを遮断することで回路内の圧力保持と流体の流れを制御する
components:
  - ポペット（弁体）
  - 弁座
  - リターンスプリング
  - バルブボディ
  - 配管継手
functions:
  - 弁座に着座して逆流を遮断する主要封止部材
  - ポペットが着座して密封を形成する接触面
  - 弁体を閉方向に付勢しクラッキング圧力を決定するばね
  - 流路・弁座・スプリングを収容する外郭部品
  - 油圧回路との接続部
top_event: 清掃装置が格納できず他の交通を妨げる
