product_name: ピボットピン（リアブレーキペダル・プッシュロッド接続部）
purpose: リアブレーキペダルとプッシュロッドを回転可動に接続し、ブレーキペダルの踏力をプッシュロッドへ滑らかに伝達する支点となる金属製ピンである。
components:
  - ピボットピン（連結ピン）
  - リアブレーキペダル
  - プッシュロッド
  - 防錆処理（表面処理）
functions:
  - リアブレーキペダルとプッシュロッドを回転可動に接続する金属製ピンとして機能する
  - ドライバーが踏力を入力するリアブレーキ操作部品として機能する
  - ブレーキペダルの踏力をリアブレーキマスタシリンダへ伝達する棒状部品として機能する
  - ピボットピン表面の錆を防止するためのメッキ・塗装等の表面処理として機能する
top_event: ブレーキが引きずるおそれがある
