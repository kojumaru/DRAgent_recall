product_name: 刈取脱穀作業車制御ユニット（灯火制御）
manufacturer: 株式会社 クボタ 代表取締役 社長 花田 晋吾
purpose: >-
  制御ユニットは刈取作業中のグレンタンク満杯を検知した際に作業灯を点滅させてオペレーターに通知する。また自動運転時には後進開始の3秒以上前に後退灯を点灯させて周囲に警告する機能を持つ。これらの灯火制御により作業安全性と周辺への警告機能を提供する。
components:
  - 作業灯
  - 後退灯
  - グレンタンク満杯センサー
  - 自動運転システム
functions:
  - 前面ガラス上面に備え作業エリアを照明する灯火
  - 後退時に後方の作業者・障害物を照らし周囲に警告する灯火
  - グレンタンクのもみ満杯を検知して制御ユニットへ信号を送る
  - 刈取経路を自動制御し後進指令を制御ユニットへ送る
top_event: 保安基準に適合しない
