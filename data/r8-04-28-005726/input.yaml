product_name: 刈取脱穀作業車制御ユニット（灯火制御）
purpose: >
  制御ユニットは、グレンタンク満杯センサーの信号を受けてオペレーターへ通知するための作業灯を制御し、また自動運転時には後進開始前に後退灯を制御することで作業の安全性と周辺への警告機能を提供する。灯火制御において保安基準に適合した動作を維持する機能を担う。
components:
  - 作業灯
  - 後退灯
  - グレンタンク満杯センサー
  - 自動運転システム
functions:
  - 前面ガラス上面に備え作業エリアを照明する灯火として機能する
  - 後退時に後方の作業者・障害物を照らし周囲に警告する灯火として機能する
  - グレンタンクのもみ満杯状態を検知して制御ユニットへ信号を送るセンサーとして機能する
  - 刈取経路を自動制御し後進指令を制御ユニットへ送るシステムとして機能する
top_event: 保安基準に適合しない
