product_name: 牽引フック（純正アクセサリー）
purpose: 車両後部のレシーバーに固定ピンで差し込み固定し、被牽引車両の牽引バーと接続して牽引力・制動力・上下方向荷重を伝達する牽引連結金具である。
components:
  - 牽引フック本体
  - 車両側レシーバー（ソケット）
  - 固定ピン・クリップ
  - 牽引バー（被牽引側）
functions:
  - 被牽引車の牽引バーと接合する金属製フック部品として機能する
  - 車両後部に装着されたフック差し込み受け座として機能する
  - 牽引フックをレシーバーに固定するロックピンおよびリテーナクリップとして機能する
  - トレーラー等の牽引連結部として機能する
top_event: 被牽引車両が外れる
