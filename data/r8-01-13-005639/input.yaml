product_name: リヤビューカメラ
purpose: 車両後退時に車両後方の死角領域を連続撮像し、映像信号をキャビン内モニターへ伝送することで運転者に後方状況を提示し、後退時の後方視認性を確保する。
functions:
  - カメラ本体を荷台後部の所定位置に固定し、リヤゲート開閉時の干渉を回避する位置に保持する
  - 広角で後方を撮像する
  - 撮像した光を電気信号に変換する
  - 映像信号をキャビン内モニターへ伝送する
  - 映像信号を受信して後方映像を表示する
components:
  - 取り付け固定用支持具（ブラケット）
  - カメラレンズ
  - 撮像素子（CCD/CMOSイメージセンサ）
  - 映像信号ケーブル
  - キャビン内モニター
top_event: カメラのレンズが損傷して視認性が悪化し法規不適合となる
