product_name: チェックバルブ / 油圧ホース
purpose: >
  チェックバルブは油圧回路内の油圧油の一方向流れを許可し、逆流を防止することで清掃装置（左右ブラシ）の作動・格納を制御する。
components:
  - 油圧ポンプ
  - ブラシアクチュエータ（油圧シリンダ/モータ）
  - リリーフバルブ
  - 作業用エンジン
functions:
  - 作業用エンジンにより駆動され、油圧回路に圧力を供給する
  - チェックバルブ・油圧ホースを通じた油圧で駆動される清掃ブラシ駆動装置
  - 回路の過圧を防止する安全弁
  - 油圧ポンプの駆動源であり、発熱により回路内温度を上昇させる
top_event: 油圧ホースが破損する
