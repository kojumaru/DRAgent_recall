product_name: ハンドルロック締付けボルト
purpose: >
  ハンドルロック締付けボルトは、ハンドルロック機構（施錠装置）を車体に固定し、施錠時にステアリングシャフト（かじ取りハンドル軸）の回転を確実に阻止する機能を維持するための締結要素である。
components:
  - ハンドルロック本体（施錠機構）
  - ステアリングステムまたは取付けブラケット
  - ロックピン
  - キーシリンダ
functions:
  - ハンドルロック締付けボルトにより車体に固定される施錠装置本体。キーシリンダと連動してロックピンを出し入れする
  - ハンドルロック本体が取り付けられる車体側の受け部材
  - 施錠時にステアリングシャフトまたはストッパーと係合し、ハンドルの回転を阻止する
  - 鍵の操作によりロックピンを駆動する機構部品
top_event: 外れたボルトがフレームに挟まると、ハンドルが転舵できず転倒する
