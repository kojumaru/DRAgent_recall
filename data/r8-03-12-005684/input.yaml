product_name: ハンドルロック締付けボルト
purpose: >
  ハンドルロック締付けボルトは、施錠装置のハンドルロック本体を車体に固定する締結要素として、施錠時にロックピンがステアリングシャフトのロック溝と確実に係合して駐車状態を保持し、かじ取操作を阻害しない状態を維持する機能を担う。
components:
  - ハンドルロック本体（施錠機構）
  - ステアリングステム（取付けブラケット）
  - ロックピン
  - キーシリンダ
functions:
  - ハンドルロック締付けボルトにより車体に固定される施錠装置本体として機能する
  - ハンドルロック本体が取り付けられる車体側の受け部材として機能する
  - 施錠時にステアリングシャフトのロック溝に係合してハンドル回転を阻止する部品として機能する
  - 鍵の操作によりロックピンを駆動する機構部品として機能する
top_event: ハンドルが転舵できず転倒する
