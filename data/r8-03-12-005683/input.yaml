product_name: シリンダ
purpose: >
  シリンダは、ピストンの往復運動を案内する燃焼室構成部材として機能する。
components:
  - ピストン
  - ピストンリング（トップリング・セカンドリング・オイルコントロールリング）
  - シリンダヘッド
  - エンジンオイル（潤滑油膜）
  - ウォータージャケット
functions:
  - シリンダボア内を往復運動し、燃焼ガス圧を受けてコンロッドへ力を伝達する
  - ピストンとシリンダ壁間を密封し、燃焼ガスの吹き抜け防止とオイルの燃焼室への掻き上げ防止を行う
  - シリンダ上部を覆い、燃焼室を形成するとともに吸排気バルブを収容する
  - シリンダ壁とピストンリング間に薄い油膜を形成し、摩耗と摩擦熱を低減する
  - シリンダブロック内に設けられた冷却水通路。シリンダを適正温度に保つ
top_event: 火災に至る
