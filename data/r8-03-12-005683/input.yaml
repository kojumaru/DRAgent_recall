product_name: シリンダ（エンジンシリンダボア）
purpose: >
  シリンダは、ピストンの往復運動を案内しながら燃焼室の気密を維持するエンジン本体構成部品として、ピストンリングとの摺動面に適切な粗さ・形状を持ち、潤滑油膜により摩擦・摩耗を抑制しつつピストンの直線運動を維持する機能を担う。
components:
  - ピストン
  - ピストンリング（トップリング・セカンドリング・オイルコントロールリング）
  - エンジンオイル（潤滑油膜）
  - シリンダヘッド
functions:
  - シリンダボア内を往復運動し燃焼ガス圧をコンロッドへ伝達する可動部品として機能する
  - シリンダ壁と接触して気密保持・オイル掻き落としを行う部品として機能する
  - シリンダ壁とピストンリング間に薄い油膜を形成して摩耗と摩擦熱を低減する媒体として機能する
  - シリンダ上部に締結され燃焼室を形成するとともに吸排気バルブを収容する部品として機能する
top_event: 火災に至る
