product_name: 方向指示器操作装置の自動復帰機構
purpose: 方向指示器レバー操作後にハンドルが直進位置に戻った際、ピンとレバーの機械的連動によりレバーを自動的に中立位置へ復帰させる機械式機構である。
components:
  - 自動復帰ピン（カムフォロワー）
  - 方向指示器レバー（ターンシグナルスイッチ）
  - ハンドル（ステアリングホイール）
  - 復帰機構ブラケット・ハウジング
functions:
  - ハンドル回転に連動してレバーを押し戻すピン部品として機能する
  - 方向指示器のON/OFFを操作するレバー部品として機能する
  - ドライバーの操縦入力を受ける回転操舵部品として機能する
  - 自動復帰機構を収容・支持する筐体部品として機能する
top_event: 正常な運転操作ができなくなる
