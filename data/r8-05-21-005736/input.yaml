product_name: エアバッグインフレータ（運転席用）
purpose: 衝突時にエアバッグECUからの点火信号を受けてガス発生剤を急速燃焼させ、エアバッグクッションを膨張展開させる点火・燃焼・膨張機構を一体に収めた金属製容器である。
components:
  - インフレータ容器
  - ガス発生剤
  - 点火装置（スクイブ）
  - フィルター・ディフューザー
functions:
  - ガス発生剤を収容する高圧封止用金属製ハウジングとして機能する
  - 点火により急速燃焼してガスを発生させる薬剤として機能する
  - エアバッグECUからの電流信号で点火するブリッジワイヤ式点火素子として機能する
  - 燃焼ガスをろ過・拡散してエアバッグクッションへ均一に供給する
top_event: エアバッグ展開時にインフレータ容器が破損する
