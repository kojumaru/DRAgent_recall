product_name: エンジンコントロールユニット（ECU）
purpose: >
  エンジンコントロールユニットは、各種センサからの信号を入力として受け、エンジンの燃料噴射量・噴射タイミング・点火タイミングを演算・制御するとともに、粒子状物質浄化装置（DPF）の再生インターバルを適正に管理し、排出ガス規制値への適合を維持する中枢制御装置である。
components:
  - クランク角センサ
  - 空気流量センサ（MAF）
  - 排気温度センサ
  - 差圧センサ
  - 粒子状物質浄化装置（DPF）
  - 燃料インジェクタ
  - 尿素SCRシステム（AdBlueシステム）
  - CAN通信バス
functions:
  - エンジン回転数・ピストン位置を検出しECUへ提供する
  - 吸入空気量を計測しECUへ提供する
  - DPF入出口の排気温度をECUへ提供する
  - DPF前後の圧力差を計測しPM堆積量をECUが推定するために使用する
  - セラミックフィルターで粒子状物質を捕集し、ECU指令により強制再生される
  - ECU指令により燃料を噴射する
  - NOx還元触媒。ECUが尿素噴射量を制御する
  - ECUと各サブシステム間のデータ通信路
top_event: 排出ガス規制値を満足しなくなる
