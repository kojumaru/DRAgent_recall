product_name: シグナルランプバルブ（方向指示器）
purpose: 方向指示器（シグナルランプ）の光源として、フィラメントの通電により規定の光度で点滅点灯し、方向指示の光信号を発するガラス電球である。
components:
  - バルブ（電球）本体
  - バルブソケット（ランプホルダー）
  - 方向指示器ランプユニット（レンズ・リフレクター）
  - 方向指示器回路（フラッシャーリレー）
functions:
  - ガラス球・フィラメント・ベースからなる光源部品として機能する
  - バルブを方向指示器ランプユニットに装着する接続部品として機能する
  - バルブを収容して光を方向指示器として配光する灯火ユニットとして機能する
  - バルブを規定周期で点滅駆動する制御回路として機能する
top_event: シグナルランプが点灯しなくなる
