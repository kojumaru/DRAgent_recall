product_name: 高電圧バッテリ（リチウムイオンバッテリパック）
purpose: 走行用モーターへの電力供給および回生ブレーキによる電力回収・貯蔵を担う電気自動車の主電源として機能する
components:
  - バッテリモジュール
  - リチウムイオンセル
  - 電極板（正極・負極）
  - セパレータ
  - バッテリマネジメントシステム（BMS）
  - バッテリパックケース
  - バッテリ冷却システム
functions:
  - 複数のリチウムイオンセルを直列・並列接続した単位ブロック
  - 正極板・負極板・セパレータ・電解質から構成されるエネルギー蓄積要素
  - 活物質を集電体に塗布した板状部材でリチウムイオンの挿入・脱離反応の場となる
  - 正極と負極を電気的に絶縁しつつリチウムイオンの通過を許容する多孔質膜
  - セル電圧・温度・電流を監視し均等化・保護制御を行う制御装置
  - モジュールを収納・保護する防水・防塵・衝撃吸収構造のハウジング
  - 動作温度を適正範囲に維持するための冷却機構
top_event: バッテリが異常発熱し火災に至る
