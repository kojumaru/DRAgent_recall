product_name: 駆動用バッテリコンピュータ
purpose: 駆動用リチウムイオンバッテリの充放電・電圧・温度・残量等を監視・制御し、バッテリ状態を正確に認識して安全に運用するバッテリ管理システムの電子制御ユニットである。
components:
  - バッテリコンピュータ（BCU/BMS ECU）
  - 電圧・電流・温度センサー群
  - バッテリモジュール（駆動用リチウムイオンバッテリ）
  - 車両制御システム（VCU/PCU）
functions:
  - バッテリ状態を監視・制御する電子制御ユニットとして機能する
  - バッテリセル/モジュールの状態を計測するセンサー部品として機能する
  - EV走行用高電圧バッテリとして電力を蓄積する
  - バッテリコンピュータからの状態情報を受信して走行制御を行うシステムとして機能する
top_event: 走行不能となる
