product_name: ドラッグリンク
purpose: ステアリングギヤの出力運動をフロントタイヤのナックルアームに伝達し転舵を実現する
components:
  - ロッドパイプ（シャフト本体）
  - フロント側ボールジョイント
  - リヤ側ボールジョイント
  - ボールジョイントダストカバー
functions:
  - ピットマンアームとナックルアーム間を連結する高強度鋼製の管状部材
  - ピットマンアームとの接続部で多方向の角度変化を吸収しながら力を伝達する
  - ナックルアームとの接続部でサスペンション上下動に伴う相対変位を吸収する
  - ボールジョイント内のグリスを保護し異物侵入を防止するゴム製カバー
top_event: タイヤチェーン装着時にドラッグリンクとタイヤチェーンが接触する
