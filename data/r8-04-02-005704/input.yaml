product_name: 取扱説明書（チャイルドシート適合表）
purpose: ユーザーが正しいチャイルドシートを正しい座席に正しく装着できるよう、各座席のチャイルドシート適合情報を正確に提供する
components:
  - CRS適合表（取扱説明書内）
  - i-Size用固定具（ISOFIXアンカーポイント）
  - 後席中央座席
  - チャイルドシート（CRS）
  - 訂正シール
functions:
  - 各座席位置・チャイルドシート種別ごとの適合可否を示す一覧表
  - UN-R129に適合するチャイルドシートを固定するための車体側金属アンカー
  - eビターラ後席の中央位置の座席（i-Size固定具が装備されていない座席）
  - 幼児・子供を衝突時の傷害から保護するための補助乗車装置
  - 誤記載箇所に正しい記載内容を示す訂正シールで貼付する修正媒体
top_event: 保安基準に適合しない
