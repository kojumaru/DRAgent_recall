product_name: 燃料タンクバンド
purpose: 燃料タンクを車体フレームに機械的に固定し、走行中の車両揺動・振動・衝撃時においても燃料タンクの位置を保持して脱落を防止する
functions:
  - 走行中の全方向慣性力に対して燃料タンクを脱落させない十分な保持力を継続的に発生する
  - 隣接部品との干渉がない状態で燃料タンクを所定位置に保持する
  - 使用期間を通じて疲労亀裂・腐食による強度低下なく規定の保持力を維持する
components:
  - 燃料タンクバンド本体
  - 締結ボルト・ナット
  - フレームブラケット（タンクサポート）
  - 燃料タンク
  - ゴムパッド（緩衝材）
  - サイドガードステー（補強部）
top_event: 燃料タンクが脱落して他の交通の妨げになる
