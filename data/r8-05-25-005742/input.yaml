product_name: リアサスペンション固定ボルト（トルクリアクションリンク固定ボルト）
purpose: リアサスペンションのロアアームとトルクリアクションリンクを締結固定し、走行中の車輪側力・縦力・上下力を適切にサスペンションメンバーへ伝達する締結部品である。
components:
  - トルクリアクションリンク固定ボルト
  - トルクリアクションリンク
  - ロアアーム
  - サスペンションメンバー（サブフレーム）
functions:
  - ロアアームとリンクを締結する高強度ボルトとして機能する
  - リアサスペンションのロアアーム変位を制御するリンク部材として機能する
  - 車輪ハブと車体サスペンションメンバーを接続する下側アームとして機能する
  - サスペンション部品を支持する車体フレーム部品として機能する
top_event: ロアアームが破損して走行不能となる
