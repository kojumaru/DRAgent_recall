product_name: 後席ドアの開スイッチ
purpose: 乗員がドア開を指示する際の入力インターフェースとして機能し、スイッチ接点の導通信号をドア制御ユニットへ送信することで後席ドアの安全な開放を実現する
functions:
  - スイッチ押圧時に接点が導通しドア開信号をドア制御ユニットへ出力する
  - 非操作時は接点が確実に開放されドア開信号を出力しない
  - スイッチ付近に水が付着した状態でも内部シール材が水密を維持し回路への浸水を防ぐ
  - チャタリングによる誤動作信号を出力しない
components:
  - 開スイッチ本体
  - スイッチ電気配線
  - ドア制御ユニット（ECU）
  - ドア開閉モータ
  - ドアラッチ機構
  - リレー付電気配線（対策追加部品）
top_event: 意図せずドアが開く
