product_name: シートベルトリトラクター（フロント左側）
purpose: 衝突時に乗員をシートに拘束することで乗員の前方移動を抑制し重大傷害を防ぐ
components:
  - ウェビング（ベルト布）
  - 巻取ドラム（スプール）
  - トーションバー
  - 復帰スプリング
  - ロック機構
functions:
  - 乗員を拘束するポリエステル製の帯状部材
  - ウェビングを巻き取る回転軸部品
  - 衝突時の高張力でねじれ変形することで荷重を吸収するロードリミッタ部材
  - 通常時にウェビングをドラムに巻き取る方向に付勢するゼンマイばね
  - 急減速または急引き出し時にドラムをロックする機構
top_event: 衝突時にシートベルトが必要以上に引き出され乗員の安全性に影響する
