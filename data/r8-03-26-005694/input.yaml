product_name: カウルルーバー止水シール
purpose: カウルルーバーと車体パネルとの境界面を密封し、エンジンルーム内の補機類へ雨水が滴下することを防止する
components:
  - カウルルーバー
  - カウルルーバー止水シール
  - 車体パネル（カウル部）
  - カウルチャンバー排水口
  - ブレーキブースタ
functions:
  - フロントウィンドシールド下部に設置されるプラスチック製カバー部材で雨水をカウルチャンバーに導く
  - カウルルーバーと車体パネルの接触面に装着されるゴム製または発泡樹脂製のシール材
  - カウルルーバーが取付けられる鋼板製車体構造部材
  - カウル部に集まった雨水を車外へ排出するための開口部
  - ブレーキペダル踏力を倍力するための負圧式倍力装置でカウルルーバー下方に設置される補機
top_event: 制動距離が長くなる
