product_name: 鉛バッテリ（バッテリ内セル間溶接部）
purpose: スターターモータへの起動電力供給およびモーター走行からエンジン走行への切り替え時のエンジン再始動用大電流を供給する補機電源として機能する
components:
  - 鉛セル
  - セル間溶接部（ストラップ接続部）
  - バッテリ筐体（ポリプロピレン製）
  - バッテリ端子（プラス・マイナス）
  - セパレータ
functions:
  - 正極板・負極板・電解液・セパレータで構成される基本電池単位
  - 隣接セルを直列接続する鉛鋳造または溶接構造の低抵抗導体
  - 全セルを収納し電解液を保持するモノブロック型プラスチックケース
  - 外部回路との接続ポスト（鉛合金製）
  - 正負極板間に配置されるポリエチレン微多孔膜。短絡を防ぎながらイオン伝導を確保する
top_event: エンジンが再始動できず走行不能に至る
