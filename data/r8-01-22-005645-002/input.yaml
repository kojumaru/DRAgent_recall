product_name: エンジンオイルポンプ
purpose: クランクシャフトの動力をオイルポンプチェーンで受け取り、潤滑油を加圧してエンジン各部に適切な油圧・流量で供給し、金属摩擦面の摩耗を防止するとともにエンジン各部を冷却する。
functions:
  - クランクシャフトからオイルポンプへ回転を伝達する
  - エンジンオイルポンプをアッパーオイルパンへ固定する
  - オイルパンからの吸い込み口で異物をろ過する
  - 油圧が規定値を超えた場合にオイルをバイパスして過圧を防止する
  - エンジン各部へ加圧オイルを分配する
  - 油圧が規定値以下に低下した場合に警告灯を点灯させる
components:
  - オイルポンプチェーン
  - アッパーオイルパン締結ボルト
  - オイルストレーナ（オイルフィルタスクリーン）
  - オイルリリーフバルブ
  - メインオイルギャラリー
  - オイルプレッシャスイッチ
top_event: 走行中にエンジンが停止する
