product_name: 電動パワーステアリングコントロールユニット
manufacturer: フォルクスワーゲングループ ジャパン株式会社
purpose: >-
  トルクセンサーからのステアリング操作トルク信号と車速信号を受け、EPSモーターへの供給電流を演算してステアリング操作力をアシストする。また異常検知機能により、モーターや電気系の故障を検知した場合にはアシスト機能を無効化してフェイルセーフ動作に移行する。
components:
  - EPSモーター
  - トルクセンサー
  - 車速センサー
  - 異常検知システム
functions:
  - コントロールユニットの指令を受けてステアリングをアシストする電動モーター
  - ステアリング操作トルクを検出してコントロールユニットに入力する
  - 車速に応じたアシスト量演算のため車速情報を供給する
  - モーターの振動・電流を監視して故障状態を判定するソフトウェア機能
top_event: ステアリング操作力が増大する
