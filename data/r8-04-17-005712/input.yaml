product_name: 電動パワーステアリングコントロールユニット
purpose: >
  EPS CUは、トルクセンサーからの操舵トルク信号と車速センサーからの車速信号を演算してEPSモーターへの電流を制御し、車速に応じた適切な操舵アシスト力を提供する。
components:
  - EPSモーター
  - トルクセンサー
  - 車速センサー
  - 異常検知システム（ソフトウェア機能）
functions:
  - コントロールユニットの指令を受けてステアリングをアシストする電動モーターとして機能する
  - ステアリング操作トルクを検出してコントロールユニットに入力するセンサーとして機能する
  - 車速に応じたアシスト量演算のため車速情報を供給するセンサーとして機能する
  - モーターの振動・電流を監視して故障状態を判定するソフトウェア機能として機能する
top_event: ステアリング操作力が増大する
