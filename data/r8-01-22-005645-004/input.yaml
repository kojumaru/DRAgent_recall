product_name: バックカメラ
purpose: >
  バックカメラは車両後退時に車両直後の映像を撮像し、モニターへ映像信号を伝送することで、運転者が後退時の安全確認を行えるようにする。
components:
  - モニター
  - 映像ケーブル（映像信号線）
  - 電源ケーブル
  - バックランプ（リバースランプ）
  - 車両後部取付ブラケット
functions:
  - バックカメラからの映像信号を受信・表示する車内表示装置
  - バックカメラからモニターへ映像信号を伝送するケーブル
  - バックカメラへ動作電力を供給するケーブル
  - 後退時にバックカメラへの連動電源供給をトリガーするランプ回路
  - バックカメラを車両後部に固定するブラケット
top_event: 保安基準に適合しない
