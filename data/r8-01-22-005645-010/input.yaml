product_name: プラネタリギアピン
purpose: プラネタリギア機構においてプラネタリギアの自転軸として機能し、ハブリダクション機構が所定の減速比で車輪に駆動力を伝達できるようプラネタリギアを回転自在に支持する
functions:
  - プラネタリギアをプラネタリキャリア上で回転自在に支持し自転・公転を可能にする
  - 設計寿命を通じて径方向荷重を繰り返し支持し折損・変形しない
  - 潤滑条件下でピン径の摩耗量を許容値以内に維持する
components:
  - プラネタリキャリア
  - プラネタリギア（遊星歯車）
  - ニードルローラーベアリング（またはブシュ）
  - サンギア
  - リングギア
  - ハブケース
top_event: 走行不能となる
