product_name: 燃料インジェクタ（噴射ノズル）
purpose: ECUからの制御信号に基づいて高圧燃料を燃焼室へ精密噴射し、適正な空燃比での燃焼を実現する電子制御型燃料噴射弁である。
components:
  - 噴射ノズル（ニードルバルブ）
  - インジェクタ本体（アクチュエータ）
  - コモンレール（高圧燃料レール）
  - ECU（エンジンコントロールユニット）
functions:
  - 燃料を燃焼室へ微粒化噴射するインジェクタ先端部品として機能する
  - ソレノイドまたは圧電素子で噴射を制御する電動弁本体として機能する
  - 高圧燃料を蓄圧してインジェクタへ供給する配管として機能する
  - インジェクタ噴射タイミング・量を制御するユニットとして機能する
top_event: PM（粒子状物質）の排出量が保安基準を超過する
