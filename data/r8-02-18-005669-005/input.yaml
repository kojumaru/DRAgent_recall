product_name: 作動油タンクブリーザ
purpose: 作動油タンクの内圧変動を外気との通気により吸収しタンクの変形や作動油漏れを防ぐ
components:
  - カバー（アルミ製バヨネット機構付き）
  - ケース（樹脂製バヨネット機構付き）
  - Oリング
  - フィルタエレメント
functions:
  - タンク口への取付および外気の取り込み口となる上部部材
  - フィルタエレメントを収容しカバーとバヨネット嵌合で結合する下部部材
  - カバーとケースの合わせ面をシールし作動油のタンク外漏出を防止するゴム製封止部材
  - 通気経路上で外気中の異物・水分を捕集するろ材
top_event: 作動油が著しく漏れる
