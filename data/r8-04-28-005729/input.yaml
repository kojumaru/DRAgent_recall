product_name: コネクタ端子（発電機側ハーネス-メインワイヤーハーネス接続）
purpose: >
  コネクタ端子は、発電機が発電した電力をメインワイヤーハーネスへ伝送する電気接続部として、低接触抵抗を維持して大電流（数十A）を安定して通電する機能を担う。表面メッキは母材の酸化・腐食を防止して接触抵抗の増大を抑制し、長期にわたる安定した導通を確保する。
components:
  - コネクタ端子本体（母材）
  - 表面メッキ（錫・銀等）
  - コネクタハウジング
  - 発電機側ハーネス／メインワイヤーハーネス
functions:
  - 電流を通電する銅合金等の金属製端子として機能する
  - 母材の酸化防止と接触抵抗低減のために施される表面処理として機能する
  - 端子を保持しコネクタ結合を維持する樹脂製ハウジングとして機能する
  - コネクタ端子の両側に接続される電線束として機能する
top_event: 火災となる
