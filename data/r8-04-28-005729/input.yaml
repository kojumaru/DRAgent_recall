product_name: コネクタ端子（発電機側ハーネス-メインワイヤーハーネス接続）
manufacturer: トライアンフモーターサイクルズジャパン株式会社 代表取締役 大貫陽介
purpose: >-
  発電機が発電した交流電力をコネクタ端子を通じてメインワイヤーハーネスへ伝送し、レギュレーターレクチファイヤーで直流変換後にバッテリーや各電装品へ供給する。コネクタ端子は低接触抵抗を維持して大電流（数十A）を安定して通電する役割を担う。
components:
  - コネクタ端子本体（母材）
  - 表面メッキ（錫・銀等）
  - コネクタハウジング
  - 発電機側ハーネス
  - メインワイヤーハーネス
functions:
  - 電流を通電する金属製端子（銅合金等）
  - 母材の酸化防止と接触抵抗低減のために施される表面処理
  - 端子を保持しコネクタ結合を維持する樹脂製ハウジング
  - 発電機からコネクタへの電線束
  - コネクタから車両各部への電線束
top_event: コネクタが溶損して火災となる
