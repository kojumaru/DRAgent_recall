product_name: アッパーアームシャフト
purpose: 独立懸架式サスペンションにおいてアッパーアームASSYをフレームに対して揺動可能に支持する回転軸として、走行荷重をフレームへ伝達しながらタイヤの姿勢を設計範囲内に保ち操縦安定性を確保する。
functions:
  - アッパーアームシャフトを揺動軸として車体フレームに連結されるコントロールアームとして機能する
  - 振動吸収と揺動を両立する弾性支持機能を提供する
  - アッパーアームシャフトを車体フレームまたはブラケットに固定する
  - アームの先端でナックルと球面連結する
  - アッパーアームとロアアームの間で車輪を保持し操舵力を伝達する
  - アッパーアーム周辺に配策されブレーキ液圧を伝達する
components:
  - アッパーアームASSY
  - ブッシュ（ゴムブッシュ）
  - ロックナット・ボルト
  - ボールジョイント（アッパー）
  - ナックル
  - ブレーキパイプ
top_event: アッパーアームシャフトが路面に脱落する
