product_name: 配線接続用カプラー（防水パッキン）
purpose: 冷凍装置用電源配線の接続部において嵌合面の水密シールを担い、外部からの水分侵入を防ぐことで電源回路の絶縁性と導通性を正常に維持する
functions:
  - カプラー嵌合面全周に均一に密着し水密状態を確立する
  - 電源回路内への水分侵入を遮断し電気的絶縁性を維持する
  - 正規の配線固定状態においてカプラーへの過大な引張・屈曲荷重を受けない
  - IP67以上の防水性能を維持し絶縁抵抗100MΩ以上を確保する
components:
  - 配線接続用カプラー本体
  - 防水パッキン
  - 冷凍装置用電源配線
  - 配線固定クランプ・ブラケット
  - 漏電保護回路（保護機能）
top_event: 走行不能となる
