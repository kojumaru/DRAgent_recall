product_name: コンビネーションメータ
purpose: 車両各部ECUからCAN通信でデータを受信し、速度計・警告灯・インジケーターランプを含む車両情報をドライバーに表示する電子制御型計器表示ユニットである。
components:
  - メータ制御ECU（マイクロコントローラ）
  - 表示パネル（LCDまたはTFT液晶）
  - 電源回路
  - CANトランシーバー
functions:
  - CAN通信データを処理してメータ表示を制御する電子制御ユニットとして機能する
  - 速度計・各種警告灯を表示する画面ユニットとして機能する
  - 12V車載電源からメータ動作電源を生成する電源管理回路として機能する
  - 車両ネットワークとのデータ通信インターフェースとして機能する
top_event: 警告灯等が確認できなくなる
