product_name: 除雪装置取付ブラケット（前フレーム）
purpose: >
  除雪装置取付ブラケットは、前フレームと除雪装置の間を構造的に接続し、除雪作業中に発生する除雪装置の自重・除雪反力・走行振動を前フレームへ安全に伝達・分散させる。
components:
  - 前フレーム本体
  - 溶接部
  - 除雪装置（ロータリブロワ等）
  - 取付ボルト・ピン
  - フレーム補強材
functions:
  - ブラケットが溶接接合される車体骨格部材
  - ブラケットと前フレームを接合する溶接継手（すみ肉溶接または完全溶け込み溶接）
  - ブラケットによって前フレームに固定される前部除雪機構
  - ブラケットと除雪装置本体を連結する締結部品
  - 前フレームの取付ブラケット周辺に配置される補強リブ・ガセット
top_event: 除雪装置が脱落し走行不能となるおそれ
