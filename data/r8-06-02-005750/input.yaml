product_name: エンジンコントロールユニット（車載式故障診断装置）
purpose: エンジン制御を実行しながら車載式故障診断装置（OBD）として外部診断機へのデータ出力機能を担う電子制御ユニットである。
components:
  - エンジンECU（マイクロコントローラ）
  - OBD通信インターフェース（OBD-IIコネクタ）
  - 各種エンジンセンサー
  - 電源回路
functions:
  - エンジン制御ロジックおよびOBD診断プログラムを実行する電子制御ユニットとして機能する
  - 外部診断機と通信するための標準診断ポートとして機能する
  - 回転数・スロットル・O2センサー等のエンジン状態入力センサー群として機能する
  - 12V車載電源からECU動作電源を供給する電源管理部として機能する
top_event: 保安基準に適合しない
