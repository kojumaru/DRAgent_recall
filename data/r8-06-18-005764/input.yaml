product_name: 低圧燃料ポンプ（インペラ／樹脂製羽根車）
purpose: 燃料タンクから燃料噴射システムへ樹脂製インペラの回転により燃料を加圧・圧送し、インペラがポンプカバーとの設計隙間を維持して規定圧力・流量の燃料を継続供給する電動ポンプである。
components:
  - インペラ（樹脂製羽根車）
  - ポンプカバー（ハウジング）
  - 電動モーター
  - 燃料フィルター（ストレーナー）
functions:
  - 成形樹脂製の回転翼として燃料を加圧・送出する
  - インペラを収容しインペラとの設計隙間を管理するケースとして機能する
  - インペラを回転駆動するDCモーターとして動力を供給する
  - ポンプ吸入側に設けられた異物除去フィルターとして機能する
top_event: 走行中エンストに至る
