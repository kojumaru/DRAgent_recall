product_name: スタータ（始動用リレー）
purpose: >
  始動用リレーの接点を閉じることでバッテリーからスタータモータへ大電流（数百 A）を供給し、フライホイールリングギヤを回転させてエンジンを始動させる。
components:
  - スタータモータ
  - フライホイールリングギヤ
  - バッテリー
  - イグニッションスイッチ/スタータリレー制御回路
functions:
  - 始動用リレーからの電流供給を受けて回転トルクを発生させる直流モータ
  - スタータのピニオンギヤが噛み合い、クランクシャフトを回転させる
  - スタータ起動時に大電流を供給する電源
  - 始動用リレーの電磁コイルに制御電流を供給する
top_event: スタータ起動時または走行時等、火災に至る
