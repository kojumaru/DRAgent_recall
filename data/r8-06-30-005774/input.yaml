product_name: 突入防止装置
purpose: 車体後面に規定距離・地上高で装着され、後続車両が追突した際に後続車前部が車体下部に突入することを防止する横断バー・フレーム構造の安全装置である。
components:
  - 突入防止バー（横断バー）
  - 支持ブラケット
  - 車体フレーム（リアフレーム）
  - 固定ボルト・ナット
functions:
  - 車体後面に水平に設置する鋼製バーとして後続車の突入を受け止める構造部材として機能する
  - 突入防止バーを車体フレームに固定する金属製ブラケットとして機能する
  - 突入防止装置を支持するスワップボディキャリアの後部フレーム構造として機能する
  - 突入防止バーとブラケットを締結する締結部品として機能する
top_event: 保安基準に適合しない
