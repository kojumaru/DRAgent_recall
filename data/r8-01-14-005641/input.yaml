product_name: パーキングブレーキケーブル
purpose: 運転者のパーキングブレーキレバー操作力をリヤブレーキ機構へ機械的に伝達し、駐停車時に車両を保持する制動力を発生させる。
functions:
  - 撚り線鋼製ロープで操作力を引張伝達する
  - ワイヤーロープを内包し取り回し経路を固定する
  - ケーブル端部をレバー側アンカーおよびブレーキ側アジャスタへ結合する
  - カシメ部付近の操作時応力を緩和し位置を規制する
  - 運転者が操作してケーブルに引張力を与える
  - ドラム/ディスクに制動力を発生させる
components:
  - ワイヤーロープ
  - アウターチューブ（コンジットチューブ）
  - カシメ端末（エンドフィッティング）
  - スペーサ
  - パーキングブレーキレバー
  - リヤブレーキ機構
top_event: パーキングブレーキが効かなくなり車両が動き出す
