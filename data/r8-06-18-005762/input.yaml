product_name: デジタルメータークラスター
purpose: CAN通信で受信した車両状態データをデジタル表示パネルに映像として表示し、速度計・警告灯等をドライバーに提供するコントロールユニット内蔵のデジタル式計器表示ユニットである。
components:
  - コントロールユニット（ECU）
  - デジタル表示パネル（TFT液晶またはOLED）
  - 電源回路
  - CANトランシーバー
functions:
  - CAN通信データを処理して表示制御を行う電子制御ユニットとして機能する
  - 速度計・警告灯等をデジタル映像で表示する画面として機能する
  - 12V車載電源からメータ動作電源を生成する電源管理回路として機能する
  - 車両ネットワーク（CAN）との通信インターフェースとして機能する
top_event: 速度計や警告灯などの表示が確認できなくなる
