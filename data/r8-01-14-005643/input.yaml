product_name: 充電器
purpose: 家庭用交流電源を直流電源に変換し、充電制御プログラムに従って駆動用鉛蓄電池を適切な電流・電圧プロファイルで充電する。
functions:
  - 交流電源を直流に変換するスイッチング電源回路として動作する
  - 充電電流・電圧・時間を制御する
  - バッテリ端子電圧および充電電流を計測してフィードバックする
  - 充電器内部温度および環境温度を監視し異常時に充電を停止する
  - 充電器からの直流電力を蓄積し走行モータへ電力を供給する
  - AC電源ケーブルを接続するインタフェースを提供する
components:
  - AC/DCコンバータ回路
  - 充電制御マイコン（充電制御プログラム搭載）
  - 電圧・電流センサ
  - 温度センサ
  - 駆動用鉛蓄電池
  - 充電コネクタ
top_event: 走行不能となる
