product_name: リヤライト（LEDドライバ）
purpose: 尾灯・制動灯・方向指示器の後部灯火機能を提供し、夜間・制動時・進路変更時に自車の状態を後続車や他の交通参加者へ伝達する
components:
  - LED素子アレイ
  - LEDドライバIC
  - リヤライト制御ユニット（LCU）
  - リヤライトハウジング
  - 光学レンズ・リフレクタ
  - ハーネスコネクタ
functions:
  - 尾灯・制動灯・方向指示器それぞれに専用のLED素子群
  - リヤライト制御ユニットからの制御信号に応じて各LEDに定電流を供給する半導体デバイス（専用ソフトウェア内蔵型）
  - 車体LINバスまたはCANバス経由で灯火指令を受けLEDドライバへ点灯制御信号を出力する制御モジュール
  - LED・基板・レンズを収納する防水プラスチック筐体
  - LEDの光を規定の配光パターンに整形する光学系
  - 車体ハーネスとリヤライトユニットを接続するコネクタ
top_event: 方向指示器が不点灯になる
