product_name: ハブベアリング（非駆動の後後軸ハブアッセンブリ）
purpose: 非駆動後後軸において車軸に対してホイールハブを低摩擦で回転可能に支持し、ラジアル荷重およびスラスト荷重を受け持つ
components:
  - ハブ本体
  - ハブベアリング（転がり軸受）
  - ロックワッシャ
  - リテーナリング
  - シーリングリング
  - ハブナット（非駆動の後後軸）
  - ハブカバー
functions:
  - ホイールを固定するフランジを持つ金属製本体。ベアリング外輪を圧入保持する
  - 内輪・外輪・転動体・保持器で構成。車軸に内輪が嵌合し外輪がハブ本体に圧入される
  - ハブナットの緩み止めとして機能する変形可能なワッシャ。ナットの回転を拘束する
  - ロックワッシャをアクスル軸端に保持するリング部品
  - ベアリング内部へのダスト・水分侵入を防ぐシール部品
  - 車軸端のねじ部に螺合し、ベアリング予圧を付与してハブアッセンブリを固定する締結部品
  - ハブ端面を保護するカバー
top_event: 火災に至る
