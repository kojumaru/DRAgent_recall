product_name: 車両制御ECU
purpose: >
  車両制御ECUは、車両内の各種サブシステムECU（エンジンECU、ブレーキECUなど）と車内ネットワーク（CAN）を介して接続し、車両固有の設定情報（車両識別番号 VIN を含む）を適切に書き込み・管理するとともに、車両全体の統合制御を行う。
components:
  - エンジンECU
  - CAN通信バス（ISO 11898準拠）
  - OBD診断コネクタ（DLC）
  - 不揮発性メモリ（EEPROM/フラッシュ）
  - イモビライザーシステム
functions:
  - 車両制御ECUからVIN等の設定値を受け取り、エンジン制御を行うサブECU
  - 車両制御ECUとエンジンECU・各サブECU間のデータ通信路
  - ISO 15031-3 / SAE J1962準拠の16ピンコネクタ。外部故障診断装置が接続されVINを含む各種情報を読み出す
  - VIN・適合値・故障コード（DTC）を永続保存する記憶媒体
  - VINと連動して車両の正当性を認証する盗難防止装置
top_event: 保安基準に適合しない
