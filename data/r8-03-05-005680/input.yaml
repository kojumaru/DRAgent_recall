product_name: 車両制御ECU
purpose: >
  車両制御ECUは、エンジンECUをはじめとする各サブECUへ車両固有の設定値（VINを含む）を正確に書き込み・管理することで、外部故障診断ツールによる車両識別情報の読み出しおよびOBD診断機能を正常に維持する機能を担う。
components:
  - エンジンECU
  - CAN通信バス
  - OBD診断コネクタ（DLC）
  - 不揮発性メモリ（EEPROM/フラッシュ）
functions:
  - 車両制御ECUからVINおよびエンジン適合値を受け取り書き込まれるサブECUとして機能する
  - 車両制御ECUとエンジンECU間のデータ伝送路として機能する
  - 外部故障診断ツールが接続してVINおよび故障コードを読み出す16ピンコネクタとして機能する
  - VINおよび設定値を永続保存する記憶媒体として機能する
top_event: 保安基準に適合しない
