product_name: ウイングパワーユニット取付ブラケット
purpose: >
  ウイングパワーユニットをボデーフレームに固定し、ウイング開閉動作時の作動荷重・振動をボデー構造に伝達・分散させる構造支持部材として機能する。
components:
  - ウイングパワーユニット
  - ボデーフレーム
  - 固定ボルト・ナット
  - ウイングパネル
functions:
  - ブラケットに固定される電動油圧式ウイング開閉装置本体
  - ブラケットが溶接固定される上部架台フレーム
  - ウイングパワーユニットをブラケットに締結する締結部品
  - ウイングパワーユニットが開閉を制御するアルミ製側面パネル
top_event: ウイングパワーユニットが脱落し、他の交通を妨げる
