product_name: 走行用油圧ポンプ
purpose: >
  走行用油圧ポンプは、エンジンから入力された機械的回転エネルギーを高圧の油圧エネルギーに変換し、走行用油圧モーターへ供給することで車両の走行（前進・後退・速度制御）を実現する油圧動力源である。
components:
  - シャフト（駆動軸）
  - シリンダブロック
  - ピストン
  - ピンリンク
  - バルブプレート（配流板）
  - 作動油
functions:
  - エンジンまたはギヤボックスからの回転動力をポンプ内部機構へ伝達する
  - ピストンが往復運動するシリンダを複数配置した回転体
  - シリンダブロック内を往復運動し、作動油を吸入・吐出する
  - ポンプ内部においてシリンダブロックまたは斜板との連結に使用される連結部品。所定の強度と寸法精度を有し、回転・往復運動を円滑に伝達する
  - ピストンの往復に同期して吸入・吐出ポートを切り替える弁機構
  - ポンプが加圧・送出する媒体（油圧作動油、JIS K 2213準拠）
top_event: 駐車ブレーキの解除ができなくなり走行不能となるおそれがある。
