product_name: 走行用油圧ポンプ（ピンリンク）
purpose: >
  走行用油圧ポンプは、エンジン回転動力を高圧作動油エネルギーに変換して走行用油圧モーターへ連続的に供給し、タイヤローラーの走行（前進・後退・速度制御）を実現する油圧動力源として機能する。
components:
  - ピンリンク
  - シリンダブロック
  - バルブプレート（配流板）
  - 作動油
  - 走行用油圧モーター
functions:
  - ポンプ内部においてシリンダブロックまたは斜板との連結に使用される連結部品として機能する
  - ピストンが往復運動するシリンダを複数配置した回転体として機能する
  - ピストンの往復に同期して吸入・吐出ポートを切り替える弁機構として機能する
  - ポンプが加圧・送出する媒体として機能する
  - 走行用油圧ポンプから供給された高圧作動油を受けて車輪を駆動する油圧モーターとして機能する
top_event: 駐車ブレーキの解除ができなくなり走行不能となる
