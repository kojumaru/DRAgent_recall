product_name: パンク応急修理用具（応急修理ホース・修理剤ボトル・圧力逃し弁）
purpose: 応急修理用ホースを通じて修理剤をタイヤ内に注入し、圧力逃し弁によりボトル内圧力を安全範囲に保持しながらパンクを応急修理するためのキットである。
components:
  - 修理剤ボトル
  - 応急修理用ホース（口金付き）
  - 圧力逃し弁（リリーフバルブ）
  - コンプレッサー
functions:
  - 液状修理剤を収容する耐圧プラスチック製容器として機能する
  - 修理剤ボトルとタイヤバルブを接続するホースとして機能する
  - ボトル内圧力が規定値を超えた場合に圧力を逃すための安全弁として機能する
  - 圧縮空気を生成してタイヤおよびボトルに送り込む電動ポンプとして機能する
top_event: 使用者が負傷するおそれがある
