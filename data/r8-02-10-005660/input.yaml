product_name: 高電圧バッテリー（セルモジュール）
purpose: >
  電気モータへの駆動用電力供給と、回生ブレーキ時の電力蓄積を担う高電圧直流電源として機能する。
components:
  - バッテリーマネジメントシステム（BMS）
  - バッテリーパックケース
  - 冷却プレート
  - 高電圧インターコネクト
functions:
  - 各セルの電圧・温度を監視し、過充電・過放電・過熱を防止する
  - セルモジュールを外部衝撃・水分・熱から保護する密閉筐体
  - セルモジュール温度を適正範囲に維持する液冷式熱交換器
  - セルモジュールとインバータ間の高電圧回路接続部品
top_event: 熱によるバッテリー異常が発生し、火災に至る
