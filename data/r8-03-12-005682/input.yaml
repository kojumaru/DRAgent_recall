product_name: タイヤサイドウォール部（大型トラック・バス用スタッドレスタイヤ）
purpose: >
  サイドウォール部は、タイヤとしての空気圧保持（内圧維持）機能を持つとともに、走行中の路面入力（縦・横方向の変形）に対してカーカスを保護し、車輪に作用する荷重を分散・吸収する構造部位である。
components:
  - カーカス
  - スチール材料（スチールコード補強層）
  - ゴム層（サイドゴム）
  - ビード部
  - トレッド部
functions:
  - ビード部間を連結するタイヤ骨格。繊維コードまたはスチールコードで構成される
  - サイドウォール内部に配置された補強用スチールコード。タイヤの側面剛性と耐カット性を向上させる
  - スチール材料を覆うゴム被覆層。スチールコードとの接着（ゴム付き）により一体化し、外傷・腐食から保護する
  - タイヤをホイールリムに固定する部位。スチールワイヤー（ビードワイヤー）とゴムで構成される
  - 路面と接する走行面。サイドウォール上部と連続している
top_event: タイヤのバーストが発生する
