product_name: タイヤサイドウォール部（大型トラック・バス用スタッドレスタイヤ）
purpose: >
  サイドウォール部は、タイヤとして内部空気圧を保持しながら走行中の縦・横荷重を吸収するカーカス保護部位として、内部スチール材料をゴム層で被覆・接着することにより一体化した構造強度を維持し、タイヤとしての空気圧保持と側面剛性を確保する機能を担う。
components:
  - カーカス
  - スチール材料（スチールコード補強層）
  - ゴム層（サイドゴム）
  - ビード部
functions:
  - ビード部間を連結するタイヤ骨格として機能する
  - サイドウォール内部に配置された補強用スチールコードとして側面剛性・耐カット性を向上させる機能を担う
  - スチール材料を覆うゴム被覆層として接着により一体化し外傷・腐食から保護する機能を担う
  - タイヤをホイールリムに固定する部位として機能する
top_event: タイヤのバーストが発生する
