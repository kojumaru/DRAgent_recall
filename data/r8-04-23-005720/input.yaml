product_name: ボディーコントロールモジュール
purpose: 各種ボディー系電装品を統合制御するとともにヘッドランプコントロールモジュールとの通信状態を監視し通信異常時に運転者へ警告メッセージを表示する
components:
  - ヘッドランプコントロールモジュール（HCM）
  - 車内通信バス（CAN/LIN）
  - 警告表示システム（インフォメーションディスプレイ）
  - 電源管理回路
  - 不揮発性メモリ（フラッシュ/EEPROM）
functions:
  - ヘッドランプの点灯制御・配光制御を担うモジュール。BCMとCAN/LIN通信で接続される
  - BCMとHCM間の制御信号・診断情報を伝送する通信インフラ
  - BCMからの信号を受けて警告メッセージを表示するドライバー情報システム
  - 車両12 V電源からBCMの動作電源を生成するDC-DCコンバータ・保護回路
  - 制御プログラム・設定値・故障コードを保存する記憶素子
top_event: 保安基準に適合しない
