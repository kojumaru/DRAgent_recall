product_name: ブレーキサーボのプッシュロッド（締結部）
purpose: ブレーキペダルアームとブレーキサーボ（電動ブレーキブースタ）を機械的に連結し、ペダル踏力をサーボ入力部に伝達する棒状部品である。
components:
  - プッシュロッド本体
  - ブレーキペダルとの締結部
  - ブレーキサーボ接続部
  - ブレーキペダルアーム
  - ブレーキサーボ（電動ブレーキブースタ）
functions:
  - 高強度鋼製の棒状伝達部材としてペダル踏力を伝達する
  - プッシュロッドとブレーキペダルアームを連結するピン・クリップ等の接合部として機能する
  - プッシュロッドとブレーキサーボ入力軸の連結部として機能する
  - ドライバーが踏力を入力するペダル部材を構成する
  - ペダル踏力を電動で倍力するアクチュエータとして制動力を増幅する
top_event: ブレーキが効かなくなる
