product_name: ステアリングギヤボックスコントロールユニット
purpose: >
  ステアリングギヤボックスコントロールユニットは、操舵トルクセンサー（ステアリングモーメントセンサー）および車速・舵角センサーの信号を入力として受け、ドライバーの操舵力を補助する電動モーターの出力トルクを算出・指令することで、安定した操舵アシストを提供する制御装置である。
components:
  - ステアリングモーメントセンサー（操舵トルクセンサー）
  - 補助センサー（サブセンサー）
  - 電動制御モーター（EPSモーター）
  - 車速センサー信号（CAN経由）
  - 舵角センサー
  - CAN通信バス
functions:
  - ステアリングシャフトのねじり量からドライバー操舵トルクを検出しコントロールユニットへ提供する
  - ステアリングモーメントセンサーの冗長系として設置され、主センサー故障時の代替信号を提供する
  - コントロールユニット指令に従って操舵アシストトルクを発生させる
  - 車速に応じたアシスト量の最適化に使用される
  - ステアリングホイール角度を検出しコントロールユニットへ提供する
  - 上位車両制御ECUとの通信路
top_event: ステアリングホイールが意図せず旋回する
