product_name: エンジンコントロールユニット（ECU）
purpose: >
  エンジンコントロールユニットは、エンジンの燃料噴射・点火タイミングを制御するとともに、尿素SCR（選択触媒還元）システムの動作状態を常時監視し、システム故障が検知された場合には保安基準の要件に従って運転者へ警告灯（MIL）を点灯させる中枢制御装置である。
components:
  - 尿素SCRシステム（AdBlueシステム）
  - NOxセンサ
  - 尿素水レベルセンサ
  - 尿素噴射弁
  - MIL（警告灯）
  - CAN通信バス
  - OBD診断コネクタ
functions:
  - NOx浄化触媒。ECUが動作状態を監視し尿素噴射量を制御する
  - SCR触媒前後のNOx濃度を計測しECUへ提供する
  - タンク内のAdBlue残量をECUへ提供する
  - ECU指令に従い尿素水をSCR触媒前の排気管へ噴射する
  - ECU出力に基づき計器盤に表示される
  - ECUと各サブシステム間のデータ通信路
  - ISO 15031 / SAE J1979 準拠の診断インターフェース
top_event: 保安基準に適合しない
