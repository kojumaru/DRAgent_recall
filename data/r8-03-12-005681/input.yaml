product_name: ルーフパネル（フロントルーフパネル）
purpose: >
  フロントルーフパネルは、車両の天井部分を覆う外装構造部品として、雨水・風圧・衝撃から車室内を保護し、車体の空気力学的形状を構成するとともに、車体剛性の一部を担う。
components:
  - ブラケット
  - 接着剤
  - ルーフレール（車体骨格）
  - 締結具（ボルト・リベット等）
functions:
  - フロントルーフパネルをボデー骨格に接合するための金属製取付け金具。接着剤の塗布面を提供し、パネルと骨格の間の荷重伝達部材となる
  - ブラケットとルーフパネル間を接合する構造用接着剤（エポキシ系またはウレタン系）。所定の塗布範囲と膜厚で施工されることにより設計接着強度を発揮する
  - フロントルーフパネルが最終的に固定される車体構造骨格部材
  - 接着剤と併用して接合強度を補完する機械的締結要素
top_event: 走行時の風圧等によりパネルが脱落して、他の交通の妨げとなる
