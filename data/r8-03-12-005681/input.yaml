product_name: ルーフパネル（フロントルーフパネル・接着部）
purpose: >
  フロントルーフパネルは、車体の天井外装として車室内を雨水・風圧・紫外線から保護するとともに、接着構造によりボデー骨格に固着して走行中の風圧荷重および自重を支持する構造部品として機能する。
components:
  - ブラケット
  - 接着剤（構造用接着剤）
  - ルーフレール（ボデー骨格）
  - シーリング材
functions:
  - フロントルーフパネルをボデー骨格に接合するための金属製取付け金具として機能する
  - ブラケットとルーフパネル間を接合する接着材料として機能する
  - フロントルーフパネルが最終的に固定される車体構造骨格部材として機能する
  - 接着部周囲の防水シール材として機能する
top_event: 走行時の風圧等によりパネルが脱落して他の交通の妨げとなる
