product_name: ステアリングギヤボックス（ハーネスコネクタ）
purpose: EPS-ECUからステアリングギヤボックス内の電動モータおよびトルクセンサへの電力・信号線を嵌合接続し、電動パワーステアリングによる操舵力アシストを正常に機能させる
functions:
  - EPS-ECUからアシストモータへの電力供給を走行振動が加わっても途切れなく継続する
  - トルクセンサ信号をEPS-ECUへ正確に伝達する
  - 走行中の振動・衝撃によってもコネクタが抜けずに規定の嵌合保持力を維持する
components:
  - ハーネスコネクタ
  - 車体ハーネス（プラグ側コネクタ）
  - EPS-ECU（電動パワーステアリング制御ユニット）
  - 電動アシストモータ
  - トルクセンサ
  - ステアリングラック
top_event: ステアリングの操作力が増大する
