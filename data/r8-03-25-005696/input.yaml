product_name: 主変速レバー
purpose: >
  主変速レバーは、オペレーターの操作入力を変速機構（HST：静油圧トランスミッションまたは機械式変速機）へ機械的に伝達することで、コンバインの走行速度を無段階または段階的に変化させる操作装置である。
components:
  - レバー本体
  - 支点部（ピボット軸受け）
  - 皿ばね
  - 変速機構連結部（ロッド・リンク機構）
  - レバーガイド（ポジションゲート）
functions:
  - オペレーターが握って操作する棒状部材。操作力を支点部へ伝達する
  - 主変速レバーの回動中心。レバーが前後または左右に操作される際の軸受け機能を持つ
  - 支点部に配置されたコーン形状のばね部品（JIS B 2706準拠）。レバーに適切な摩擦抵抗（節度感）を与え、任意の変速位置でレバーを保持する機能を持つ。過大な負荷が支点部に集中しないよう荷重を分散する役割も担う
  - 主変速レバーの動きをHSTまたは変速ギヤボックスへ伝達するリンク機構
  - 変速段位置を視覚的・触覚的に識別するためのガイド部材
top_event: レバー支点部溶接箇所が破損して外れ、走行不能となる
