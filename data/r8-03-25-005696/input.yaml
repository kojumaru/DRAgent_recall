product_name: 主変速レバー（支点部・皿ばね・溶接箇所）
purpose: >
  主変速レバーは、オペレーターの変速操作入力を支点部・皿ばね・リンク機構を通じてHSTまたは変速ギヤボックスへ伝達し、コンバインの走行速度を無段階または段階的に制御する操作装置として機能する。
components:
  - 皿ばね（コーン形状ばね）
  - 支点部（ピボット軸受け・溶接箇所）
  - 変速機構連結部（ロッド・リンク機構）
  - レバー本体
functions:
  - 支点部に配置されてレバーに節度感を与え荷重分散するばね部品として機能する
  - 主変速レバーの回動中心となる軸受け部位として機能する
  - 主変速レバーの動きをHSTまたは変速ギヤボックスへ伝達するリンクとして機能する
  - オペレーターが握って操作する棒状部材として機能する
top_event: レバー支点部溶接箇所が破損して外れ走行不能となる
