product_name: リアブレーキホース遮熱チューブ（リアブレーキホースリテイナー）
purpose: リアブレーキホースを排気管の放射熱から保護する断熱保護チューブと位置保持リテイナーの組み合わせにより、ブレーキホース表面温度を許容範囲以下に維持する熱保護部品である。
components:
  - リアブレーキホース遮熱チューブ
  - リアブレーキホースリテイナー
  - リアブレーキホース
  - 排気管（マフラー）
functions:
  - ブレーキホースを覆う耐熱保護チューブとして排気管放射熱を遮断する
  - ブレーキホースを所定位置に保持するブラケット・クランプ部品として機能する
  - ブレーキフルードを封止してリアブレーキキャリパーへ油圧を伝達する油圧ホースとして機能する
  - ブレーキホース至近に位置する高温の排気経路部品として放射熱を発生させる
top_event: リアブレーキが作動しなくなる
