product_name: 電動ブレーキコントロールモジュール
purpose: 電動パーキングブレーキの作動・解除を電子制御するとともにEPBシステム異常時にパーキングブレーキが作動された場合に赤色警告灯を点滅させて運転者に異常を告知する
components:
  - 電動パーキングブレーキアクチュエータ
  - EPBスイッチ
  - 赤色警告灯（ブレーキ警告灯）
  - ホイールスピードセンサ
  - CAN通信バス
  - 油圧ブレーキ制御ユニット（HCU）
functions:
  - EPBモータとギア機構で構成され、パーキングブレーキのキャリパーピストンを電動で押圧・解除するアクチュエータ
  - 運転者がパーキングブレーキの作動・解除を入力するスイッチ
  - EPB異常時に点滅することで運転者に異常を告知するインジケータランプ
  - 各輪の車輪速度をEBCMへ入力するセンサ（ABS制御との連携）
  - EBCM・VCM・インスツルメントパネル間の通信ネットワーク
  - ABSアクチュエータ（電磁弁・ポンプ）を含む油圧ブロック
top_event: 保安基準に適合しない
