product_name: エアドライヤ再生制御バルブ
purpose: エアブレーキシステムのエアドライヤ内乾燥剤を再生するため圧縮空気の流路を開閉制御し、乾燥した清浄な圧縮空気をエアブレーキ系統へ安定供給する制御バルブである。
components:
  - 再生制御バルブ本体
  - バルブシール（Oリング・シート）
  - エアドライヤ本体
  - エア圧力制御システム（APS）
functions:
  - 乾燥剤再生時の圧縮空気流路を開閉するソレノイドバルブとして機能する
  - バルブ内部の気密を保持するゴム製または樹脂製シール部品として機能する
  - 乾燥剤を収容し圧縮空気から水分を除去するユニットを構成する
  - エアブレーキ系統全体の圧力を管理する制御システムとして機能する
top_event: エア圧力が下がって非常ブレーキがかかり走行不能となる
