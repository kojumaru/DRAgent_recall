product_name: トランスミッション用制御コンピュータ
purpose: >
  エンジン回転数・車速・アクセル開度・セレクターポジション等の信号を受信し、最適な変速段を演算してソレノイドバルブを制御する。
components:
  - 自動変速機（AT）本体
  - エンジン制御ユニット（ECU）
  - 入出力軸回転センサ
  - 車速センサ
functions:
  - TCUが制御するソレノイドバルブ・クラッチ・ブレーキ等を内包する
  - エンジン回転数・トルク情報をCAN通信で送信する
  - AT入出力軸の回転数をTCUに送信する
  - 車速情報をTCUに送信する
top_event: 漏れたトランスミッションフルードが排気管に付着して火災に至る
