product_name: ヘッドライトハーネス（右ヘッドライト）
purpose: 右ヘッドライトユニットへの電力供給および制御信号伝達を担い、車体側配線と右ヘッドライトを電気的に接続する被覆電線束である。
components:
  - ヘッドライトハーネス（電線束）
  - コネクタ・端子
  - 右前輪ホイールインナートリム
  - 右ヘッドライトユニット
functions:
  - 右ヘッドライトへの電力・信号を伝達する被覆電線の束として機能する
  - ヘッドライトユニット側および車体側配線と接続する電気接続部品として機能する
  - ホイールハウス内部の樹脂製カバーとしてハーネス近接部品を構成する
  - 前照灯本体（光源・リフレクター・レンズ一体品）として発光機能を提供する
top_event: 右ヘッドライトが点灯しなくなる
