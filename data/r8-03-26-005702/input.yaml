product_name: リヤビューカメラ
purpose: シフトポジションがリバース時に車両直後の映像をリアルタイムでモニターに表示し後退時衝突のリスクを低減する
components:
  - イメージセンサ（CMOS/CCD）
  - 広角レンズ
  - プリント基板（信号処理基板）
  - コネクタ端子
  - カメラハウジング
  - 映像信号ケーブル
  - ヘッドユニット（モニター）
functions:
  - 映像を電気信号に変換する撮像素子
  - 車両直後の広範囲を撮影するレンズ光学系
  - 映像信号処理・映像エンコード・電源制御ICを実装した基板
  - プリント基板と外部ハーネスを接続するはんだ付け実装端子
  - レンズ・基板を収納する防水・耐衝撃プラスチックケース
  - カメラからヘッドユニットへ映像信号を伝送する同軸ケーブル
  - 受信した映像を表示するインフォテインメント系ディスプレイ
top_event: 後退時に衝突する
