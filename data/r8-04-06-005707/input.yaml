product_name: エアコンユニットハーネス（ワイヤーハーネス）
purpose: 空調システムの電力供給と制御信号伝送を担う車内配線束として各コンポーネントへ電力・制御信号を提供する
components:
  - 電線束
  - コネクタ（各電装品接続用）
  - ハーネス固定クランプ・テープ
  - マイクロフィルターハウジングカバー
  - 締結部（ハウジングカバー締結ボルト・爪）
  - デフロスターユニット
functions:
  - 複数の被覆電線をテープまたはチューブで束ねた配線束本体
  - ブロワーモーター・各アクチュエーター・センサー接続のための防水コネクタ
  - ハーネスを所定の配策経路に固定するための保持部材
  - 外気フィルター収納部のカバーで、ハーネス配策経路の近傍に締結部を持つ
  - マイクロフィルターハウジングカバーを固定する締結機構
  - フロントガラスの曇り・霜を除去する電気ヒーターまたはブロワー駆動の温風供給装置
top_event: 短絡により火災に至る
