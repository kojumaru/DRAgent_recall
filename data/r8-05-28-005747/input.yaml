product_name: 低圧燃料ポンプモジュール（インペラ／ポンプカバー）
purpose: 燃料タンクから燃料噴射システムへインペラの回転により燃料を加圧・圧送し、インペラとポンプカバーが適正な隙間を維持して規定圧力・流量の燃料を継続供給する電動ポンプモジュールである。
components:
  - インペラ（羽根車）
  - ポンプカバー（ハウジング）
  - 電動モーター
  - 燃料フィルター（ストレーナー）
functions:
  - モーター軸に取り付けられた樹脂製回転翼として燃料を加圧・送出する
  - インペラを収容し燃料流路を形成するケースとしてインペラとの隙間を精密に管理する
  - インペラを回転駆動するDCモーターとして動力を供給する
  - ポンプ吸入側に設けられた異物除去フィルターとして機能する
top_event: 走行中にエンジンが停止して再始動できなくなる
