product_name: メインハーネス（アングルセンサカプラ含む）
purpose: 電力供給・制御信号伝送・センサ信号伝送の三機能を担う車両電装の幹線系統として各補機と制御装置を接続する
components:
  - 電線（各芯線）
  - コネクタ（カプラ）
  - アングルセンサカプラ
  - ハーネステープ・クランプ
  - パワーリレーコード
  - 燃料ホース（隣接部品）
functions:
  - 銅導体に絶縁被覆を施した個別電線で信号・電力を伝送する
  - 各電装部品の接続部、ロック機構付き防水・防塵コネクタ
  - バンク角センサと接続するコネクタで、センサ信号線・電源線・グランド線からなる
  - 複数の電線をまとめ車体に固定するための保護・固定部材
  - メインリレーへの電力供給線で、メインハーネスと並走する補助コード
  - アングルセンサカプラが干渉する可能性のある燃料系配管
top_event: 火災に至る
