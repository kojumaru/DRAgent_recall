product_name: キャビンドアロック（ドアノブ固定ボルト）
purpose: ドアノブを支点に規定締め付けトルクで固定し、キャビン内外からのドア開閉操作を可能にする締結部品である。
components:
  - ドアノブ固定ボルト
  - ドアノブ本体
  - ドアノブ支点（ピボット部）
  - ドアロック機構
  - キャビンドアパネル
functions:
  - ドアノブ本体をピボット支点に締結・保持する
  - 作業者が握って操作するハンドル部品を固定する
  - ドアノブの回転中心となる軸受け部を構成する
  - ドアノブの操作をラッチ解除動作に伝達するリンク機構を支持する
  - ボルトおよびドアノブが取付けられる鋼板製ドア構造体を構成する
top_event: キャビン内側および外側からドアの開閉ができなくなる
